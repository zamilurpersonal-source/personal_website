<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1c1410">
<title>Roll to War</title>
<style>
@font-face{font-family:'Cinzel';src:url('fonts/cinzel.woff') format('woff');font-weight:400 900;font-display:block}
@font-face{font-family:'Cinzel Decorative';src:url('fonts/cinzel-decorative-700.woff') format('woff');font-weight:700;font-display:block}
@font-face{font-family:'Cinzel Decorative';src:url('fonts/cinzel-decorative-900.woff') format('woff');font-weight:900;font-display:block}
@font-face{font-family:'Signika';src:url('fonts/signika.woff') format('woff');font-weight:300 700;font-display:block}
:root{--bg:#1c1410;--bg2:#2a1d14;--panel:#2b1a0e;--ink:#23170f;--gold:#f2be4b;--text:#fff3d6;--muted:#e9d6b0;--accent:#2f6fe2;color-scheme:dark}
html,body{margin:0;height:100%;background:var(--bg);overflow:hidden;overscroll-behavior:none}
body{touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;font-family:Signika,"Trebuchet MS",sans-serif;color:var(--text)}
#stage{position:fixed;inset:0;box-sizing:border-box;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px);display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at center,var(--bg2) 0%,var(--bg) 70%)}
#rtw{display:block;touch-action:none;outline:none;box-shadow:0 0 40px rgba(0,0,0,.55)}
#tune{position:fixed;right:12px;top:12px;bottom:12px;width:min(360px,calc(100vw - 24px));background:rgba(28,18,10,.97);border:2px solid var(--gold);border-radius:14px;color:var(--text);display:flex;flex-direction:column;z-index:10;box-shadow:0 10px 40px rgba(0,0,0,.6);font-size:14px}
#tune[hidden]{display:none}
#tune .tp-head{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;padding:12px 14px;border-bottom:1px solid rgba(242,190,75,.35)}
#tune .tp-head strong{font-family:Cinzel,Georgia,serif;font-weight:900;font-size:17px;color:var(--gold);flex:1}
#tune .tp-head span{order:3;width:100%;font-size:12.5px;color:var(--muted)}
#tune .tp-head button{order:2;min-width:44px;min-height:44px;border-radius:10px;border:2px solid var(--gold);background:var(--panel);color:var(--text);font-size:18px;cursor:pointer}
#tune .tp-body{flex:1;overflow:auto;padding:6px 14px 10px;touch-action:pan-y;-webkit-user-select:text;user-select:text}
#tune fieldset{border:1px solid rgba(242,190,75,.3);border-radius:10px;margin:10px 0;padding:6px 10px 10px}
#tune legend{font-family:Cinzel,Georgia,serif;font-weight:900;color:var(--gold);padding:0 6px}
#tune .tp-row{display:grid;grid-template-columns:1fr 110px 44px;align-items:center;gap:8px;min-height:36px}
#tune .tp-row input{width:100%;accent-color:var(--gold)}
#tune output{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
#tune .tp-chk{display:flex;align-items:center;gap:10px;min-height:40px}
#tune .tp-chk input{width:22px;height:22px;accent-color:var(--gold)}
#tune .tp-foot{display:flex;gap:8px;padding:10px 14px;border-top:1px solid rgba(242,190,75,.35)}
#tune .tp-foot button{flex:1;min-height:44px;border-radius:10px;border:2px solid var(--gold);background:var(--panel);color:var(--text);font-weight:700;font-size:13.5px;cursor:pointer}
#tune button:focus-visible,#tune input:focus-visible{outline:3px solid #7cadff;outline-offset:2px}
#ask{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;background:rgba(12,8,4,.72);padding:16px;box-sizing:border-box}
#ask[hidden]{display:none}
#ask .box{width:min(340px,100%);background:linear-gradient(#94603a,#5f3a1f);border:3px solid var(--ink);box-shadow:0 0 0 2px var(--gold) inset,0 10px 40px rgba(0,0,0,.6);border-radius:16px;padding:18px 18px 14px;display:flex;flex-direction:column;gap:10px}
#ask label{font-family:Cinzel,Georgia,serif;font-weight:900;font-size:17px;letter-spacing:1px;color:var(--gold);text-align:center}
#ask p.hint{margin:0;font-size:13px;color:var(--muted);text-align:center}
#ask input{font:700 18px Signika,"Trebuchet MS",sans-serif;padding:10px 12px;border-radius:10px;border:3px solid var(--ink);background:#fbf0d2;color:#3a2412;outline:none;-webkit-user-select:text;user-select:text;touch-action:auto}
#ask input:focus-visible{box-shadow:0 0 0 3px #7cadff}
#ask p.err{margin:0;min-height:18px;font-size:13px;font-weight:700;color:#ffb4a8;text-align:center}
#ask .btns{display:flex;gap:10px}
#ask button{flex:1;min-height:46px;border-radius:12px;border:3px solid var(--ink);font:900 15px Cinzel,Georgia,serif;letter-spacing:1px;cursor:pointer}
#ask button.ok{background:linear-gradient(#ffe89a,#f6bd3e 55%,#cc8418);color:var(--ink)}
#ask button.no{background:linear-gradient(#c48a52,#94603a 55%,#5f3a1f);color:var(--text)}
#ask button:focus-visible{outline:3px solid #7cadff;outline-offset:2px}

</style>
</head>
