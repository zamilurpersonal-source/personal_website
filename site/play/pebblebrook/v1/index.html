<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pebblebrook</title>
<style>@font-face{font-family:'Fredoka';font-weight:500;font-style:normal;font-display:swap;src:url('fonts/fredoka-latin-500-normal.woff2') format('woff2')}@font-face{font-family:'Fredoka';font-weight:600;font-style:normal;font-display:swap;src:url('fonts/fredoka-latin-600-normal.woff2') format('woff2')}@font-face{font-family:'Fredoka';font-weight:700;font-style:normal;font-display:swap;src:url('fonts/fredoka-latin-700-normal.woff2') format('woff2')}@font-face{font-family:'Nunito';font-weight:700;font-style:normal;font-display:swap;src:url('fonts/nunito-latin-700-normal.woff2') format('woff2')}@font-face{font-family:'Nunito';font-weight:800;font-style:normal;font-display:swap;src:url('fonts/nunito-latin-800-normal.woff2') format('woff2')}@font-face{font-family:'Nunito';font-weight:900;font-style:normal;font-display:swap;src:url('fonts/nunito-latin-900-normal.woff2') format('woff2')}html,body{margin:0;height:100%;overflow:hidden}</style>
</head>
<body>
<style>
  /* Pebblebrook: a village high street in side view. The village fills a canvas; the purse and village size float on top and a
     bottom panel holds the street map and the chosen building. Training swaps the canvas to a building's training ground,
     with its own heads-up display, result card and hint line. */
  :root {
    --ink: #4A3A36; --ink-2: #8A7466; --paper: #FFF9F0; --paper-2: #F3E7D6; --sky: #F6DCC6; --line: #E6D6C2;
    --go: #7FAF6B; --go-2: #5E8F52; --gold: #F2C14E; --gold-2: #C9962A; --hot: #E0664A; --pink: #EE7FA8; --pink-2: #C85A84;
    --display: "Fredoka", "Arial Rounded MT Bold", "Trebuchet MS", system-ui, sans-serif;
    --ui: "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
    color-scheme: light;
  }
  html, body { height: 100%; }
  body { margin: 0; background: var(--sky); color: var(--ink); font: 700 15px/1.35 var(--ui); overflow: hidden; overscroll-behavior: none; -webkit-tap-highlight-color: transparent; }
  button { font: inherit; color: inherit; cursor: pointer; touch-action: manipulation; }
  button:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
  [hidden] { display: none !important; }
  .app { position: relative; height: 100%; overflow: hidden; -webkit-user-select: none; user-select: none; }
  #cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

  .top { position: absolute; left: 0; right: 0; top: 0; z-index: 5; display: flex; align-items: flex-start; gap: 8px; padding: calc(10px + env(safe-area-inset-top, 0px)) 14px 6px; pointer-events: none; }
  .top > * { pointer-events: auto; }
  .pill { background: rgba(255,249,240,.92); border-radius: 18px; box-shadow: 0 2px 0 rgba(74,58,54,.12), 0 8px 20px rgba(140,80,50,.10); }
  .purse { flex: none; display: grid; gap: 3px; padding: 7px 14px 8px 11px; }
  .purse b { display: flex; align-items: center; gap: 7px; font: 600 27px/1 var(--display); font-variant-numeric: tabular-nums; }
  .purse b::before { content: ''; flex: none; width: 19px; height: 19px; border-radius: 50%; background: radial-gradient(circle at 35% 32%, #FFF3C8 0 16%, var(--gold) 46%, var(--gold-2) 100%); box-shadow: inset 0 0 0 2px rgba(201,150,42,.5); }
  .purse span { font: 800 12px/1.15 var(--ui); color: var(--ink-2); font-variant-numeric: tabular-nums; white-space: nowrap; padding-left: 26px; }
  .purse b.pop { animation: pop .35s ease; }
  @keyframes pop { 40% { transform: scale(1.06); } }
  .tier { margin-left: auto; flex: 0 1 190px; min-width: 0; display: grid; gap: 5px; padding: 8px 13px 9px; }
  .tier small { font: 800 10px/1 var(--ui); letter-spacing: .07em; text-transform: uppercase; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tier b { font: 600 17px/1 var(--display); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tier i { display: block; height: 6px; border-radius: 3px; background: #EADCC8; overflow: hidden; }
  .tier i em { display: block; height: 100%; width: 0%; background: var(--go); border-radius: 3px; transition: width .4s; }
  .icon { width: 40px; height: 40px; flex: none; border: 0; border-radius: 50%; display: grid; place-items: center; }
  .icon svg { width: 19px; height: 19px; }

  .panel { position: absolute; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--paper); border-radius: 24px 24px 0 0; box-shadow: 0 -6px 26px rgba(140,80,50,.16);
    padding: 10px 16px calc(12px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 10px; }
  .mapwrap { position: relative; }
  #map { display: block; width: 100%; height: 50px; border-radius: 14px; background: var(--paper-2); touch-action: none; cursor: pointer; }
  .card { display: grid; grid-template-columns: 46px minmax(0, 1fr) auto; gap: 12px; align-items: center; min-height: 58px; }
  #cardIcon { width: 46px; height: 46px; border-radius: 14px; background: var(--paper-2); align-self: start; }
  .ct { font: 600 19px/1.1 var(--display); }
  .cd { font: 700 12.5px/1.3 var(--ui); color: var(--ink-2); text-wrap: pretty; }
  .cs { display: flex; flex-wrap: wrap; gap: 5px 10px; margin-top: 4px; font: 800 12px/1.2 var(--ui); color: var(--ink); font-variant-numeric: tabular-nums; }
  .cs span { display: inline-flex; align-items: center; gap: 4px; }
  .cs span::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: var(--c, var(--go)); }
  .cs span.chip { padding: 2px 8px 2px 6px; border-radius: 10px; background: var(--cb, #FBE3EC); color: var(--ct, var(--pink-2)); }
  .acts { display: grid; gap: 6px; justify-items: stretch; }
  .btn { position: relative; overflow: hidden; border: 0; border-radius: 16px; padding: 9px 14px 8px; min-width: 104px; background: var(--go); color: #fff; box-shadow: 0 3px 0 var(--go-2);
    display: grid; justify-items: center; gap: 2px; font: 600 17px/1 var(--display); }
  .btn small { font: 800 11.5px/1.1 var(--ui); opacity: .92; }
  .btn:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--go-2); }
  .btn.gold { background: var(--gold); color: var(--ink); box-shadow: 0 3px 0 var(--gold-2); }
  .btn.pink { background: var(--pink); color: #fff; box-shadow: 0 3px 0 var(--pink-2); }
  .btn.soft { background: var(--paper-2); color: var(--ink); box-shadow: 0 3px 0 #E0CFB8; }
  .btn[aria-disabled="true"] { background: #EFE5D8; color: #A8968A; box-shadow: 0 3px 0 #DDCDB9; }
  .btn.nudge { animation: nudge 1.6s ease-in-out infinite; }
  @keyframes nudge { 0%, 70%, 100% { transform: none; } 80% { transform: translateY(-3px) scale(1.03); } 90% { transform: none; } }
  .btn .fill { position: absolute; left: 0; bottom: 0; height: 4px; width: 100%; background: var(--go); transform-origin: left; transform: scaleX(0); }
  .btn > * { position: relative; }
  .row { display: flex; gap: 8px; align-items: center; }
  .seg { display: inline-flex; padding: 3px; border-radius: 13px; background: var(--paper-2); gap: 2px; }
  .seg button { border: 0; background: transparent; border-radius: 10px; padding: 6px 11px; font: 800 12.5px/1 var(--ui); color: var(--ink-2); }
  .seg button[aria-pressed="true"] { background: var(--paper); color: var(--ink); box-shadow: 0 1px 0 rgba(74,58,54,.14); }
  .streak { margin-left: auto; font: 900 12px/1 var(--ui); color: var(--ink-2); white-space: nowrap; }
  .streak b { color: var(--pink-2); font-weight: 900; }
  .reset { border: 0; background: none; font: 800 12px/1 var(--ui); color: var(--ink-2); padding: 6px 4px; text-decoration: underline; text-underline-offset: 3px; }
  .reset.sure { color: var(--hot); }

  .toast { position: absolute; z-index: 12; left: 50%; top: calc(80px + env(safe-area-inset-top, 0px)); transform: translate(-50%, -8px); opacity: 0; width: max-content; max-width: min(88%, 420px);
    padding: 9px 15px; border-radius: 16px; background: rgba(74,58,54,.92); color: var(--paper); font: 800 13.5px/1.3 var(--ui); text-align: center; text-wrap: balance; transition: opacity .25s, transform .25s; pointer-events: none; }
  .toast.on { opacity: 1; transform: translate(-50%, 0); }
  .banner { position: absolute; z-index: 8; left: 50%; top: 32%; transform: translate(-50%, -50%) scale(.6); opacity: 0; pointer-events: none; text-align: center; display: grid; gap: 6px; width: min(92%, 460px);
    transition: opacity .3s, transform .45s cubic-bezier(.2,1.4,.3,1); }
  .banner.on { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  .banner small { font: 900 13px/1 var(--ui); letter-spacing: .14em; text-transform: uppercase; color: var(--paper); text-shadow: 0 2px 0 rgba(74,58,54,.45); }
  .banner b { font: 700 46px/1 var(--display); color: var(--gold); -webkit-text-stroke: 2px var(--ink); paint-order: stroke fill; text-shadow: 0 4px 0 var(--ink); }
  .banner span { font: 800 15px/1.3 var(--ui); color: var(--paper); text-shadow: 0 2px 0 rgba(74,58,54,.55); }

  /* ---- the training ground ---- */
  .train { position: absolute; inset: 0; z-index: 9; pointer-events: none; display: none; }
  .app.training .train { display: block; }
  .app.training .top, .app.training .panel, .app.training .banner { display: none; }
  .thud { position: absolute; left: 0; right: 0; top: 0; display: flex; align-items: flex-start; gap: 8px; padding: calc(10px + env(safe-area-inset-top, 0px)) 12px 0; }
  .tclock { flex: none; display: grid; gap: 2px; padding: 7px 13px 8px; min-width: 86px; }
  .tclock small { font: 900 10.5px/1 var(--ui); letter-spacing: .12em; color: var(--ink-2); }
  .tclock b { font: 600 27px/1 var(--display); font-variant-numeric: tabular-nums; }
  .tgoal { flex: 1 1 auto; min-width: 0; display: grid; gap: 6px; padding: 9px 13px 9px; }
  .tgoal span { font: 800 12px/1.15 var(--ui); color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-variant-numeric: tabular-nums; }
  .tprog { position: relative; height: 10px; border-radius: 5px; background: #EADCC8; }
  .tprog i { position: absolute; left: 0; top: 0; bottom: 0; width: 100%; border-radius: 5px; background: var(--gold); transform-origin: left; transform: scaleX(0); }
  .tprog em { position: absolute; top: -4px; width: 4px; height: 18px; margin-left: -2px; border-radius: 2px; background: rgba(255,255,255,.95); box-shadow: 0 0 0 2px var(--ink); }
  .tprog em.g { background: #FFF; opacity: .9; }
  .tprog u { position: absolute; top: -3px; width: 0; height: 16px; border-left: 2px dashed var(--c); margin-left: -1px; text-decoration: none; }
  .tquit { pointer-events: auto; }
  .tstars { position: absolute; left: 50%; transform: translateX(-50%); top: calc(74px + env(safe-area-inset-top, 0px)); display: flex; align-items: center; gap: 6px; padding: 5px 12px 5px 9px; white-space: nowrap; }
  .tstars i { font-style: normal; font-size: 18px; line-height: 1; color: #D9CBB8; transition: transform .2s; }
  .tstars i.on { color: var(--gold); text-shadow: 0 1px 0 var(--gold-2); transform: scale(1.18); }
  .tstars small { font: 800 11.5px/1 var(--ui); color: var(--ink-2); }
  .tcount { position: absolute; left: 50%; top: 40%; transform: translate(-50%, -50%); font: 700 88px/1 var(--display); color: var(--gold); -webkit-text-stroke: 3px var(--ink); paint-order: stroke fill; text-shadow: 0 5px 0 var(--ink); }
  .tcount.go { animation: countIn .45s cubic-bezier(.2,1.5,.4,1); }
  @keyframes countIn { from { transform: translate(-50%, -50%) scale(.4); opacity: 0; } }
  .thint { position: absolute; left: 50%; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); width: max-content; max-width: min(92%, 460px); padding: 9px 16px 10px; border-radius: 18px;
    background: rgba(74,58,54,.9); color: var(--paper); font: 800 15px/1.25 var(--ui); text-align: center; text-wrap: balance; }
  .thint:empty { display: none; }
  .thint small { display: block; font: 700 12.5px/1.3 var(--ui); opacity: .85; margin-top: 2px; }
  .tsplit { position: absolute; right: 14px; top: calc(118px + env(safe-area-inset-top, 0px)); padding: 6px 11px; border-radius: 12px; font: 600 20px/1 var(--display); font-variant-numeric: tabular-nums; opacity: 0; transition: opacity .2s; }
  .tsplit.on { opacity: 1; }
  .tsplit.fast { background: #E3F1D9; color: #4E7F42; box-shadow: 0 2px 0 rgba(78,127,66,.3); }
  .tsplit.even { background: var(--paper); color: var(--ink-2); box-shadow: 0 2px 0 rgba(74,58,54,.15); }
  .tsplit.slow { background: #FBE1DA; color: #B34A33; box-shadow: 0 2px 0 rgba(179,74,51,.3); }
  .tsplit small { display: block; font: 800 10px/1 var(--ui); letter-spacing: .08em; margin-top: 3px; opacity: .8; }
  .tcut { position: absolute; left: 50%; top: 42%; transform: translate(-50%, -50%); font: 700 40px/1 var(--display); color: var(--paper); -webkit-text-stroke: 2px var(--ink); paint-order: stroke fill; text-shadow: 0 3px 0 var(--ink); }
  .tres { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(90%, 360px); pointer-events: auto; background: var(--paper); border-radius: 26px; padding: 18px 18px 16px; text-align: center;
    box-shadow: 0 4px 0 rgba(74,58,54,.18), 0 18px 50px rgba(74,40,20,.35); display: grid; gap: 8px; animation: cardIn .35s cubic-bezier(.2,1.3,.4,1); }
  @keyframes cardIn { from { transform: translate(-50%, -44%) scale(.92); opacity: 0; } }
  .tres > small { font: 900 12px/1 var(--ui); letter-spacing: .14em; color: var(--ink-2); }
  .tres > b { font: 600 46px/1 var(--display); font-variant-numeric: tabular-nums; }
  .medal { justify-self: center; display: inline-flex; align-items: center; gap: 6px; padding: 5px 13px 5px 9px; border-radius: 14px; font: 600 16px/1 var(--display); color: #fff; background: var(--m, #A8968A); box-shadow: 0 2px 0 rgba(74,58,54,.2); }
  .medal::before { content: ''; width: 14px; height: 14px; border-radius: 50%; background: rgba(255,255,255,.55); box-shadow: inset 0 0 0 2px rgba(255,255,255,.7); }
  .medal.none { background: #EFE5D8; color: #8A7466; box-shadow: none; }
  .medal.none::before { display: none; }
  .rrows { display: grid; gap: 5px; margin-top: 2px; }
  .rrows div { display: flex; align-items: center; justify-content: center; gap: 6px; font: 800 13.5px/1.25 var(--ui); padding: 6px 10px; border-radius: 12px; background: var(--paper-2); font-variant-numeric: tabular-nums; }
  .rrows div.good { background: #E3F1D9; color: #4E7F42; }
  .rrows div.bad { background: #FBE8E2; color: #B34A33; }
  .rrows div.star { background: #FFF1CC; color: #9A6E12; }
  .rrows div.fresh { background: #E4EEF8; color: #4B6F99; }
  .tres p { margin: 0; font: 700 13px/1.35 var(--ui); color: var(--ink-2); text-wrap: pretty; }
  .rbtns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 4px; }
  .rbtns .btn { min-width: 0; }
  .tfade { position: absolute; inset: 0; z-index: 20; background: #FBEBD8; opacity: 0; pointer-events: none; transition: opacity .22s ease; }
  .tfade.on { opacity: 1; pointer-events: auto; }

  /* ---- cards over everything: prizes, new moves, welcome back ---- */
  .modal { position: absolute; inset: 0; z-index: 15; display: grid; place-items: center; background: rgba(74,58,54,.35); padding: 16px; }
  .mcard { width: min(100%, 360px); background: var(--paper); border-radius: 26px; padding: 20px 18px 16px; text-align: center; display: grid; gap: 8px; box-shadow: 0 18px 50px rgba(74,40,20,.35); animation: pop2 .35s cubic-bezier(.2,1.3,.4,1); }
  @keyframes pop2 { from { transform: scale(.9); opacity: 0; } }
  .mcard canvas { justify-self: center; width: 96px; height: 96px; }
  .mcard > small { font: 900 12px/1 var(--ui); letter-spacing: .14em; text-transform: uppercase; color: var(--pink-2); }
  .mcard b { font: 600 28px/1.1 var(--display); }
  .mcard b.cash { color: var(--go-2); font-size: 34px; }
  .mcard p { margin: 0; font: 700 14px/1.4 var(--ui); color: var(--ink-2); text-wrap: pretty; }
  .mbtns { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 8px; margin-top: 6px; }
  .mbtns .btn { min-width: 0; }

  @media (min-width: 760px) {
    .panel { left: 50%; right: auto; bottom: 16px; width: 660px; transform: translateX(-50%); border-radius: 24px; padding-bottom: 12px; }
    .tier { min-width: 190px; }
    .thud { max-width: 760px; margin: 0 auto; }
  }
  @media (max-width: 380px) { .purse b { font-size: 24px; } .tier { flex-basis: 150px; padding: 7px 10px 8px; } .tier b { font-size: 15px; } .btn { min-width: 92px; padding: 8px 11px 7px; } .tclock b { font-size: 23px; } }
  @media (max-height: 520px) and (orientation: landscape) { .tstars { top: calc(64px + env(safe-area-inset-top, 0px)); } .thint { bottom: 8px; padding: 6px 12px 7px; font-size: 13.5px; } .tsplit { top: 64px; } }
  @media (prefers-reduced-motion: reduce) { .banner, .toast, .tfade { transition: none; } .purse b.pop, .btn.nudge, .tres, .mcard, .tcount.go { animation: none; } }
</style>

<div class="app" id="app">
  <canvas id="cv" aria-label="Pebblebrook: a village high street with a Post Office whose bots copy your training runs"></canvas>
  <header class="top">
    <div class="purse pill"><b id="money">$0</b><span id="rate">Starting up</span></div>
    <div class="tier pill" id="tier"><small id="tierPop">Pebblebrook · 8 of 16</small><b id="tierName">Hamlet</b><i><em id="tierBar"></em></i></div>
    <button class="icon pill" id="soundBtn" type="button" aria-label="Turn sound off">
      <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 8v4h3l4 3.5v-11L6 8H3z" fill="currentColor"/><path id="waves" d="M13 7.2a4 4 0 0 1 0 5.6M15.2 5a7 7 0 0 1 0 10" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path id="mute" d="M13 7.5l5 5m0-5l-5 5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" hidden/></svg>
    </button>
  </header>
  <div class="banner" id="banner" aria-live="polite"><small id="bannerSmall">Pebblebrook is now a</small><b id="bannerTitle">Village</b><span id="bannerText"></span></div>
  <section class="panel" id="panel">
    <div class="mapwrap"><canvas id="map" aria-label="Street map: tap to look at another part of the high street"></canvas></div>
    <div class="card" id="card">
      <canvas id="cardIcon" width="92" height="92" aria-hidden="true"></canvas>
      <div style="min-width:0"><div class="ct" id="cardTitle">Pebblebrook</div><div class="cd" id="cardText"></div><div class="cs" id="cardStats"></div></div>
      <div class="acts" id="cardActs"></div>
    </div>
    <div class="row">
      <div class="seg" role="group" aria-label="View"><button type="button" id="homeBtn" aria-pressed="true">Home</button><button type="button" id="streetBtn" aria-pressed="false">Whole street</button></div>
      <span class="streak" id="streak"></span>
      <button type="button" class="reset" id="resetBtn">Start over</button>
    </div>
  </section>

  <div class="train" id="train" aria-hidden="true">
    <div class="thud">
      <div class="tclock pill"><small id="tTake">TAKE 1</small><b id="tTime">00.00</b></div>
      <div class="tgoal pill"><div class="tprog" id="tProg"><i id="tFill"></i><u id="tPaceA" style="--c:#E9B130"></u><u id="tPaceB" style="--c:#EE7FA8"></u><em class="g" id="tGhost"></em></div><span id="tGoal">Post Office</span></div>
      <button class="icon pill tquit" id="tQuit" type="button" aria-label="Back to the village">
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M5 5l10 10M15 5L5 15" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
      </button>
    </div>
    <div class="tstars pill" id="tStars" hidden><i>★</i><i>★</i><i>★</i><small id="tStarsText">Course of the day</small></div>
    <div class="tsplit" id="tSplit"></div>
    <div class="tcount" id="tCount" aria-live="assertive"></div>
    <div class="tcut" id="tCut" hidden>Oops!</div>
    <div class="thint" id="tHint" aria-live="polite"></div>
    <div class="tres" id="tRes" role="dialog" aria-labelledby="rLabel" hidden>
      <small id="rLabel">NEW BEST</small>
      <b id="rTime">0.00s</b>
      <span class="medal" id="rMedal">Gold</span>
      <div class="rrows" id="rRows"></div>
      <p id="rNote"></p>
      <div class="rbtns"><button type="button" class="btn soft" id="rAgain"><span>Go again</span></button><button type="button" class="btn gold" id="rDone"><span>Village</span></button></div>
    </div>
  </div>

  <div class="modal" id="modal" role="dialog" aria-labelledby="mTitle" hidden>
    <div class="mcard"><canvas id="mIcon" width="192" height="192" aria-hidden="true"></canvas><small id="mKicker"></small><b id="mTitle"></b><p id="mText"></p><div class="mbtns" id="mBtns"></div></div>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <div class="tfade" id="tFade"></div>
</div>

<script>
// ===== Train the Bots: physics and routes (pure, no DOM) =====
// Same one-button platformer as Rooftop Relay v3, plus layers: every floor of a route has its own
// running direction, and springs bounce you up to the next floor.
const RR = (() => {
  const DT = 1 / 60;
  // PACE slows the whole game down evenly: speeds x PACE, accelerations x PACE^2, timers / PACE.
  // Jumps keep exactly the same shape in space, they just take longer, so runs feel more deliberate.
  const PACE = 0.8;
  // AIR_V is the double jump (Pebblebrook's village move): from flat ground it tops out about 4.6 tiles up,
  // short of the next floor (5), but from a 1-high obstacle it reaches it. GLIDE_FALL caps the fall while gliding.
  const P = { DJ_V: 16.5 * PACE, AIR_V: 13 * PACE, MAX_FALL: 22 * PACE, GLIDE_FALL: 3.6 * PACE,COYOTE: 0.09 / PACE, BUFFER: 0.12 / PACE, BOOST_T: 1.0 / PACE, TAR_MUL: 0.5, SPRING_V: 27 * PACE, STEP: 0.3, MAX_T: 120 };
  const PF = { foot: { RUN: 7.0 * PACE, JUMP_V: 19.5 * PACE, G: 60 * PACE * PACE, CUT: 2.6, PW: 0.6, PH: 0.9, BOOST_MUL: 1.7 } };
  const T = { AIR: 0, WALL: 1, BRICK: 2, METAL: 3, CRATE: 4, TAR: 5, BOOST: 6, SPRING: 7, PLAT: 8, GIRDER: 9, SPIKE: 10, CONT: 11, BUMP: 12 };
  const SOLID = new Uint8Array(16), ONEWAY = new Uint8Array(16), PRIO = new Uint8Array(16);
  [T.WALL, T.BRICK, T.METAL, T.CRATE, T.TAR, T.BOOST, T.SPRING, T.CONT, T.BUMP].forEach(t => SOLID[t] = 1);
  [T.PLAT, T.GIRDER].forEach(t => ONEWAY[t] = 1);
  for (let i = 0; i < 16; i++) PRIO[i] = 2;
  PRIO[T.TAR] = 1; PRIO[T.BUMP] = 3; PRIO[T.BOOST] = 4; PRIO[T.SPRING] = 5;
  // floor surfaces (tar, boost pads, springs) sit in one-way floors: you land on them, but you can jump up through them
  const SURF = new Uint8Array(16); [T.TAR, T.BOOST, T.SPRING].forEach(t => SURF[t] = 1);
  const BLOCK = (t) => SOLID[t] && !SURF[t];
  const EV = { JUMP: 1, DJ: 2, LAND: 4, SPRING: 8, BOOST: 16, STAMP: 32, DIE: 64, DONE: 128, ITEM: 1024, BUMP: 4096, CUT: 8192 };

  // ---- level builder -------------------------------------------------------
  // def: { id, w, h, build(b), layers: [{ row, dir }], finish: { x, row }, springV }
  function makeLevel(def) {
    const W = def.w, H = def.h;
    const g = new Uint8Array(W * H);
    const set = (x, y, t) => { if (x >= 0 && x < W && y >= 0 && y < H) g[y * W + x] = t; };
    const L = { id: def.id, floors: def.floors || 0, w: W, h: H, g, stamps: [], props: [], start: { x: 1.2, y: 10 }, springV: def.springV || 0, layers: (def.layers || []).map((ly) => Object.assign({}, ly)), finish: def.finish, rowDir: {} };
    const b = {
      fill(x0, x1, y0, y1, t) { for (let x = x0; x <= x1; x++) for (let y = y0; y <= y1; y++) set(x, y, t); },
      row(x0, x1, y, t) { for (let x = x0; x <= x1; x++) set(x, y, t); },
      clear(x0, x1, y0, y1) { for (let x = x0; x <= x1; x++) for (let y = y0; y <= y1; y++) set(x, y, T.AIR); },
      stamp(x, y) { L.stamps.push({ x: x + 0.5, y: y + 0.5 }); },
      prop(x, y, kind, o) { L.props.push(Object.assign({ x, y, kind }, o || {})); },
      start(x, feetRow) { L.start = { x, y: feetRow }; },
    };
    def.build(b);
    L.rowIdx = {};
    L.layers.forEach((ly, i) => { L.rowDir[ly.row] = ly.dir; L.rowIdx[ly.row] = i; });
    L.startDir = L.rowDir[L.start.y] || 1;
    // route progress: running length along the layers, in tiles, from the start to the finish
    let acc = 0;
    L.layers.forEach((ly, i) => {
      ly.i = i;
      ly.a = i === 0 ? L.start.x : (ly.dir > 0 ? 1 : W - 1 - PF.foot.PW);
      ly.b = i === L.layers.length - 1 ? L.finish.x - PF.foot.PW / 2 : (ly.dir > 0 ? W - 1 - PF.foot.PW : 1);
      ly.base = acc; acc += Math.abs(ly.b - ly.a);
    });
    L.length = acc;
    return L;
  }

  function at(L, x, y) {
    if (y < 0 || y >= L.h) return 0;
    if (x < 0 || x >= L.w) return T.WALL;
    return L.g[y * L.w + x];
  }
  // which layer a runner is on (or falling toward): the first floor at or below its feet
  function layerOf(L, y) {
    const feet = y + PF.foot.PH;
    let best = L.layers[0];
    for (const ly of L.layers) if (ly.row >= feet - 0.35 && (best.row < feet - 0.35 || ly.row < best.row)) best = ly;
    return best;
  }
  function progress(L, x, y) {
    const ly = layerOf(L, y);
    const d = ly.dir > 0 ? x - ly.a : ly.a - x;
    return ly.base + Math.max(0, Math.min(Math.abs(ly.b - ly.a), d));
  }

  function newRun(L) {
    const pf = PF.foot;
    return {
      x: L.start.x, y: L.start.y - pf.PH, vy: 0, ground: true, coyote: P.COYOTE, buf: 0, dj: false,
      prev: false, boost: 0, tar: false, glide: false, noCut: false, t: 0, dead: false, done: false,
      got: 0, ev: 0, under: T.WALL, blocked: false, impact: 0, bag: 0, dir: L.startDir || 1, lay: 0, sp: false, air: false
    };
  }

  function roomAbove(L, nx, top, pf) {
    const x0 = Math.floor(nx + 0.02), x1 = Math.floor(nx + pf.PW - 0.02);
    const y0 = Math.floor(top - pf.PH + 0.02);
    for (let cy = y0; cy < top; cy++) for (let cx = x0; cx <= x1; cx++) if (SOLID[at(L, cx, cy)]) return false;
    return true;
  }

  function moveX(s, dx, L, pf) {
    if (dx === 0) return;
    let nx = s.x + dx;
    const cx = dx > 0 ? Math.floor(nx + pf.PW - 1e-6) : Math.floor(nx + 1e-6);
    const y0 = Math.floor(s.y + 0.02), y1 = Math.floor(s.y + pf.PH - 0.02);
    let top = -1;
    for (let cy = y0; cy <= y1; cy++) if (BLOCK(at(L, cx, cy))) { top = cy; break; }
    s.blocked = false;
    if (top >= 0) {
      const feet = s.y + pf.PH;
      if (top === y1 && feet - top <= P.STEP && roomAbove(L, nx, top, pf)) {
        s.y = top - pf.PH; // ledge assist: pop up onto a lip we nearly cleared
        if (s.vy > 0) s.vy = 0;
      } else {
        nx = dx > 0 ? Math.max(s.x, cx - pf.PW) : Math.min(s.x, cx + 1);
        s.blocked = true;
      }
    }
    s.x = nx;
  }

  function moveY(s, dy, L, pf) {
    const wasGround = s.ground;
    s.ground = false;
    const x0 = Math.floor(s.x + 0.02), x1 = Math.floor(s.x + pf.PW - 0.02);
    if (dy >= 0) {
      const f0 = s.y + pf.PH, f1 = f0 + dy;
      const rA = Math.ceil(f0 - 1e-4), rB = Math.floor(f1);
      for (let r = rA; r <= rB; r++) {
        let best = -1;
        for (let cx = x0; cx <= x1; cx++) {
          const t = at(L, cx, r);
          if ((SOLID[t] || ONEWAY[t]) && (best < 0 || PRIO[t] > PRIO[best])) best = t;
        }
        if (best >= 0) {
          s.y = r - pf.PH; s.vy = 0; s.ground = true; s.under = best;
          if (!wasGround) s.ev |= EV.LAND;
          return;
        }
      }
      s.y += dy;
    } else {
      const h0 = s.y, h1 = s.y + dy;
      const bA = Math.floor(h0 + 1e-4), bB = Math.floor(h1) + 1;
      for (let bb = bA; bb >= bB; bb--) {
        const r = bb - 1;
        for (let cx = x0; cx <= x1; cx++) if (BLOCK(at(L, cx, r))) { s.y = bb; s.vy = 0; s.ev |= EV.BUMP; return; }
      }
      s.y += dy;
    }
  }

  function hitSpike(s, L, pf) {
    const x0 = Math.floor(s.x), x1 = Math.floor(s.x + pf.PW);
    const y0 = Math.floor(s.y), y1 = Math.floor(s.y + pf.PH);
    for (let cy = y0; cy <= y1; cy++) for (let cx = x0; cx <= x1; cx++) {
      if (at(L, cx, cy) === T.SPIKE && s.x < cx + 0.85 && s.x + pf.PW > cx + 0.15 && s.y < cy + 1 && s.y + pf.PH > cy + 0.5) return true;
    }
    return false;
  }

  // is there floor under the runner within d tiles below its feet?
  function groundWithin(s, L, pf, d) {
    const x0 = Math.floor(s.x + 0.02), x1 = Math.floor(s.x + pf.PW - 0.02), f = s.y + pf.PH;
    for (let r = Math.ceil(f - 1e-4), rb = Math.floor(f + d); r <= rb; r++) for (let cx = x0; cx <= x1; cx++) { const t = at(L, cx, r); if (SOLID[t] || ONEWAY[t]) return true; }
    return false;
  }
  function jump(s, pf) { s.vy = -pf.JUMP_V; s.ground = false; s.coyote = 0; s.buf = 0; s.noCut = false; s.ev |= EV.JUMP; }

  // One fixed 1/60 s tick. `hold` = jump input held this tick. ab = { pf, speed, dj, glide }
  // Moves are off unless ab turns them on, so runs without them behave exactly as before:
  //  dj    - one press in the air jumps again (AIR_V), once per time in the air
  //  glide - a hold that began in the air, kept while falling, floats you down at GLIDE_FALL
  function step(s, hold, L, ab) {
    const dt = DT, pf = ab.pf || PF.foot;
    s.ev = 0;
    const pressed = hold && !s.prev;
    s.prev = hold;
    let spd = pf.RUN * (ab.speed || 1);
    if (s.boost > 0) spd *= pf.BOOST_MUL;
    if (s.tar) spd *= P.TAR_MUL;

    if (pressed) {
      if (s.ground || s.coyote > 0) jump(s, pf);
      else {
        if (ab.glide) s.air = true;
        // a tap just before landing stays a buffered jump: the double jump only fires when the ground is further off
        // than the buffer window would carry you
        if (ab.dj && !s.dj && !(s.vy > 0 && groundWithin(s, L, pf, s.vy * P.BUFFER))) { s.vy = -P.AIR_V; s.dj = true; s.noCut = false; s.buf = 0; s.ev |= EV.DJ; }
        else s.buf = P.BUFFER;
      }
    } else if (s.buf > 0 && (s.ground || s.coyote > 0)) jump(s, pf);
    if (s.buf > 0) s.buf = Math.max(0, s.buf - dt);
    if (!hold || s.ground) s.air = false;

    if (s.air && s.vy >= 0) {
      s.glide = true;
      s.vy = s.vy > P.GLIDE_FALL ? Math.max(P.GLIDE_FALL, s.vy - 3 * pf.G * dt) : Math.min(P.GLIDE_FALL, s.vy + pf.G * dt);
    } else {
      s.glide = false;
      s.vy += (s.vy < 0 && !hold && !s.noCut ? pf.G * pf.CUT : pf.G) * dt;
    }
    if (s.vy >= 0) s.noCut = false;
    if (s.vy > P.MAX_FALL) s.vy = P.MAX_FALL;

    moveX(s, spd * dt * s.dir, L, pf);
    moveY(s, s.vy * dt, L, pf);

    if (s.ground) { s.coyote = P.COYOTE; s.dj = false; } else s.coyote = Math.max(0, s.coyote - dt);
    s.boost = Math.max(0, s.boost - dt);
    s.tar = false;
    // landing on a floor turns you the way that floor runs; reaching a higher floor without a spring is a shortcut
    if (s.ev & EV.LAND) { const r = Math.round(s.y + pf.PH); if (L.rowDir[r]) { if (L.rowIdx[r] > s.lay && !s.sp) s.ev |= EV.CUT; s.dir = L.rowDir[r]; s.lay = L.rowIdx[r]; } s.sp = false; }

    if (s.ground) {
      if (s.under === T.BOOST) { if (s.boost <= 0) s.ev |= EV.BOOST; s.boost = P.BOOST_T; }
      else if (s.under === T.TAR) s.tar = true;
      else if (s.under === T.SPRING) { s.vy = -(L.springV || P.SPRING_V); s.ground = false; s.coyote = 0; s.noCut = true; s.sp = true; s.ev |= EV.SPRING; }
    }
    if (s.y > L.h + 1 || hitSpike(s, L, pf)) { s.dead = true; s.ev |= EV.DIE; }
    for (let i = 0; i < L.stamps.length; i++) {
      if (s.got & (1 << i)) continue;
      const st = L.stamps[i];
      if (s.x < st.x + 0.45 && s.x + pf.PW > st.x - 0.45 && s.y < st.y + 0.45 && s.y + pf.PH > st.y - 0.45) { s.got |= 1 << i; s.ev |= EV.STAMP; }
    }
    s.t += dt;
    const F = L.finish, cx = s.x + pf.PW * 0.5;
    if (!s.dead && s.y + pf.PH <= F.row + 0.01 && (F.dir > 0 ? cx >= F.x : cx <= F.x)) { s.done = true; s.ev |= EV.DONE; }
    if (s.t > P.MAX_T) s.dead = true;
  }

  // ---- buildings ------------------------------------------------------------
  // Floors stack like the wells in Bouncy Barrels. Each floor module places its obstacles relative to its
  // floor row R (rows grow downward, so R - 1 is the tile you run past). Floors alternate direction from the
  // ground floor (right) up; the rooftop always runs left, to the customer's door beside the lift.
  // A building is 18 tiles inside; a wing makes every floor 8 tiles longer (W, the last inside tile, 18 -> 26).
  // Obstacles in 1..18 never move; wing obstacles sit in 19..26, and right-running floors keep their
  // trampoline at the far end (x = W). Version 7 spread every floor out from 14 tiles, so there is more
  // running room between obstacles to see what's coming.
  // Level rules: the ground floor is an obstacle-free run-up (at least 2 s from the start), and the floor
  // under each set of new floors keeps 4 clear tiles before its trampoline, where a teach take starts.
  // Surfaces read the same everywhere: TAR slows you (purple goo), BOOST speeds you up (green arrows),
  // SPIKE ends the take (red, with a warning sign), SPRING bounces you (yellow).
  const BASE_W = 18, WING = 8, DOCK_ROW = 45, TOWER_H = 49;
  const plat = (b, R, W) => b.row(1, W, R, T.PLAT);
  const obst = (b, x, R, h, kind, o) => { b.fill(x, x + ((o && o.w) || 1) - 1, R - h, R - 1, T.METAL); b.prop(x, R - h, kind, Object.assign({ h }, o || {})); };
  const TOWER = {
    dock: { name: 'LOADING DOCK', build(b, R, W) {
      b.fill(1, W, R, R + 3, T.WALL);                                              // ground slab: the run-up
      if (W > BASE_W) { b.clear(19, 20, R, R + 3); b.prop(19, R, 'hatch', { w: 2 }); } // wing: an open hatch
      b.row(W, W, R, T.SPRING);
    } },
    mail: { name: 'MAILROOM', build(b, R, W) {
      plat(b, R, W); b.row(2, 4, R, T.AIR);                                        // a hole by the trampoline
      b.fill(5, 7, R - 2, R - 1, T.CRATE); b.prop(5, R - 2, 'parcels', { w: 3, h: 2 });
      if (W > BASE_W) obst(b, 21, R, 1, 'trolley');
      b.row(1, 1, R, T.SPRING);
    } },
    gym: { name: 'GYM', build(b, R, W) {
      plat(b, R, W); b.row(4, 6, R, T.TAR);                                        // smoothie spill
      obst(b, 9, R, 1, 'rack');                                                    // dumbbell rack
      b.row(10, 11, R, T.BOOST);                                                   // treadmill (then 6 clear tiles: a teach take starts here)
      if (W > BASE_W) obst(b, 21, R, 1, 'bench');
      b.row(W, W, R, T.SPRING);
    } },
    office: { name: 'OFFICE', build(b, R, W) {
      plat(b, R, W);
      obst(b, 11, R, 1, 'desk', { w: 2 });                                         // a desk
      b.fill(5, 6, R - 2, R - 1, T.CRATE); b.prop(5, R - 2, 'copier', { w: 2, h: 2 }); // the copier: climb it, or leap from it
      if (W > BASE_W) obst(b, 21, R, 1, 'cooler');
      b.row(1, 1, R, T.SPRING);
    } },
    kitchen: { name: 'KITCHEN', build(b, R, W) {
      plat(b, R, W);
      b.row(8, 8, R - 1, T.SPIKE); b.prop(8, R - 1, 'stove');                     // a hot stove: don't touch it
      b.row(11, 12, R, T.TAR);                                                     // spilled oil
      obst(b, 15, R, 2, 'fridge');
      if (W > BASE_W) obst(b, 19, R, 1, 'counter');                               // then 6 clear tiles: a teach take starts here
      b.row(W, W, R, T.SPRING);
    } },
    garden: { name: 'GREENHOUSE', build(b, R, W) {
      plat(b, R, W);
      b.row(12, 12, R - 1, T.SPIKE); b.prop(12, R - 1, 'cactus');                  // a cactus (room to land before it after the fridge shortcut)
      b.row(8, 9, R, T.TAR);                                                       // a puddle
      b.fill(5, 5, R - 1, R - 1, T.SPRING); b.prop(5, R - 1, 'mushroom');         // a bouncy mushroom in a planter
      if (W > BASE_W) b.row(19, 21, R, T.TAR);                                     // wing: a mud bed
      b.row(1, 1, R, T.SPRING);
    } },
    arcade: { name: 'ARCADE', build(b, R, W) {
      plat(b, R, W);
      b.row(4, 5, R, T.BOOST);                                                     // neon speed pads
      b.fill(9, 10, R - 2, R - 1, T.METAL); b.prop(9, R - 2, 'claw', { w: 2, h: 2 }); // claw machine: its shortcut lands on the roof before the skylight
      b.row(13, 14, R, T.TAR);                                                     // ball pit
      if (W > BASE_W) obst(b, 22, R, 1, 'pinball');
      b.row(W, W, R, T.SPRING);
    } },
    roof: { name: 'ROOFTOP', build(b, R, W) {
      plat(b, R, W); b.row(8, 9, R, T.AIR);                                        // a skylight gap: every route up here crosses it, shortcut or not
      b.stamp(8, R - 4.6);                                                         // bonus parcel, high over the gap
      obst(b, 15, R, 1, 'ac');                                                     // AC unit
      if (W > BASE_W) obst(b, 21, R, 1, 'dish');
    } },
  };
  const PETS = {
    shop: { name: 'SHOP FLOOR', build(b, R, W) {
      b.fill(1, W, R, R + 3, T.WALL);                                              // ground slab: the run-up
      if (W > BASE_W) obst(b, 21, R, 1, 'basket');                                 // wing: a dog basket
      b.row(W, W, R, T.SPRING);
    } },
    hamsters: { name: 'HAMSTER HALL', build(b, R, W) {
      plat(b, R, W);
      b.row(13, 14, R, T.BOOST); b.prop(13, R - 3, 'wheel', { w: 2, h: 3 });       // a giant hamster wheel spins you along
      b.row(9, 10, R, T.AIR);                                                      // a gap in the floor
      obst(b, 4, R, 2, 'seeds');                                                   // a sack of seeds
      if (W > BASE_W) obst(b, 21, R, 1, 'tube');
      b.row(1, 1, R, T.SPRING);
    } },
    fish: { name: 'AQUARIUM', build(b, R, W) {
      plat(b, R, W);
      b.fill(6, 7, R - 2, R - 1, T.CRATE); b.prop(6, R - 2, 'tank', { w: 2, h: 2 }); // the big tank: climb it, or leap from it
      b.row(11, 12, R, T.TAR);                                                     // a wet floor
      if (W > BASE_W) obst(b, 19, R, 1, 'turtle');                                // then 6 clear tiles: a teach take starts here
      b.row(W, W, R, T.SPRING);
    } },
    birds: { name: 'AVIARY', build(b, R, W) {
      plat(b, R, W);
      obst(b, 13, R, 1, 'cage');                                                   // a birdcage
      b.row(8, 9, R, T.TAR);                                                       // a pile of feathers
      b.fill(4, 4, R - 1, R - 1, T.SPRING); b.prop(4, R - 1, 'perch');            // a springy perch
      if (W > BASE_W) obst(b, 21, R, 1, 'birdbath');
      b.row(1, 1, R, T.SPRING);
    } },
    cats: { name: 'CAT CAFE', build(b, R, W) {
      plat(b, R, W);
      obst(b, 6, R, 1, 'cattree');                                                 // a cat tree
      b.row(13, 13, R - 1, T.SPIKE); b.prop(13, R - 1, 'cat');                      // a sleeping cat: don't wake it
      b.row(17, 17, R, T.TAR); b.prop(17, R, 'yarn');                              // tangled yarn slows you
      if (W > BASE_W) obst(b, 21, R, 1, 'post');
      b.row(W, W, R, T.SPRING);
    } },
    roof: { name: 'ROOF TERRACE', build(b, R, W) {
      plat(b, R, W); obst(b, 13, R, 1, 'chimney');                                 // no gap up here: a chimney to hop
      b.stamp(13, R - 4.6);                                                        // bonus parcel, high over the chimney
      obst(b, 5, R, 1, 'kennel');
      if (W > BASE_W) obst(b, 21, R, 1, 'planter');
    } },
  };
  // floors in order from the ground up (the roof goes on top); sizes are the floor counts a building grows through
  const BUILDINGS = {
    tower: { name: 'PARCEL TOWER', floors: TOWER, order: ['dock', 'mail', 'gym', 'office', 'kitchen', 'garden', 'arcade'], sizes: [4, 6, 8] },
    pets: { name: 'PET PALACE', floors: PETS, order: ['shop', 'hamsters', 'fish', 'birds', 'cats'], sizes: [4, 6] },
  };
  function levelDef(bid, n, wing) {
    const B = BUILDINGS[bid], F = B.floors, W = BASE_W + (wing ? WING : 0), w = W + 2;
    const ids = B.order.slice(0, n - 1).concat('roof');
    const rows = ids.map((_, i) => DOCK_ROW - 5 * i), roofRow = rows[n - 1];
    return {
      id: `${bid}${n}${wing ? 'w' : ''}`, bid, floors: n, wing: !!wing, inner: W, w, h: TOWER_H, springV: 25.5 * PACE,
      layers: ids.map((id, i) => ({ row: rows[i], dir: i % 2 ? -1 : 1, id, name: F[id].name })),
      finish: { x: 3.0, row: roofRow, dir: -1 },
      build(b) {
        b.fill(0, 0, roofRow - 3, TOWER_H - 1, T.WALL); b.fill(w - 1, w - 1, roofRow - 3, TOWER_H - 1, T.WALL); // outer walls and parapets
        ids.forEach((id, i) => F[id].build(b, rows[i], W));
        b.start(2.2, DOCK_ROW);                                                    // bots step off the dock pad
      },
    };
  }
  const cache = {};
  function level(bid, n, wing) {
    const k = `${bid}${n}${wing ? 'w' : ''}`;
    if (!cache[k]) { const L = makeLevel(levelDef(bid, n, wing)); L.bid = bid; L.wing = !!wing; L.inner = BASE_W + (wing ? WING : 0); cache[k] = L; }
    return cache[k];

    if (S.money < s.cost) { sfx.no(); toast(`${s.what} costs ${fmt$(s.cost)}. Your bots are earning it.`); return; }

    const from = B.stage.floors, L = B.L;
    B.st.step++; syncTower(B);
    B.st.teach = s.kind === 'floors' ? { from: from - 1 } : { full: true };   // the take starts on the old top floor, now the first new one

  // ---------- the course of the day ----------

  const dayKey = (d = new Date()) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;

  // ---------- reasons to retrain, and the tower's card ----------

  function freshText(B) {
    if (!B.st.fresh) return null;

    if (a < FRESH_FULL) return `Fresh +50% · ${fmtLeft(FRESH_FULL - a)}`;
    if (a < FRESH_GONE) return `Fresh +${Math.round(FRESH_BONUS * freshK(B) * 100)}%, fading`;

  // the one best reason to train this tower now, for the Train button
  function trainReason(B) {

    const nm = newMoves(B);
    if (nm) return { sub: `New move: ${MOVE_NAMES[nm & 1 ? 1 : 2]}`, hot: true };
    if (freshK(B) < 1) return { sub: 'Freshen up: +50% pay', hot: true };
    if (!courseDone(B)) return { sub: 'Course of the day ★★★', hot: true };
    if (B.st.disc && B.discTr) return { sub: `Beat ${B.def.bots[B.st.disc.bot].name}'s ${B.st.disc.t.toFixed(2)}s`, hot: false };
    const nx = nextMedalFor(B, B.st.lesson.t);

  // the next medal up from time t that the player can reach now (Star shows once the double jump is unlocked)
  function nextMedalFor(B, t) { for (let i = B.medals.length - 1; i >= 0; i--) { const m = B.medals[i]; if (m.id === 'star' && !(mvNow() & 1)) continue; if (t > m.t) return m; } return null; }
  function towerCard(B, money) {
    const st = B.st, stats = [];

      if (st.disc && B.discTr) stats.push([`${B.def.bots[st.disc.bot].name} ran ${st.disc.t.toFixed(2)}s`, '#9A86D6', 'chip', '#EEE8FA', '#6B58A6']);
    }
    acts += act('Train', why.sub, why.hot ? 'gold nudge' : 'gold', true, 'train');

    if (st.lesson && hc != null) acts += act(`Hire ${B.def.bots[B.fleet.length].name}`, fmt$(hc), 'soft', money >= hc && !!B.lessonTr, 'hire', hc);

// ---- props.js ----
  // ===== the training ground's look: rooms, floors, surfaces and every obstacle, in the village's cosy style =====
  // Drawn in training-ground tiles with y up from the loading dock's floor (yu = DOCK_ROW - row), with the village's helpers
  // (box, poly, circ, ...), so the same art paints the full-size training ground and the tower miniatures in the village.
  // The colours say what a thing does, everywhere: purple goo slows you, green belts speed you up, red things end the take,
  // orange trampolines bounce you up a floor.
  const ROOM_COL = { dock: ['#F3E0D0', '#B9825E'], mail: ['#F6E3C8', '#C99A63'], gym: ['#E4EAD6', '#8FA877'], office: ['#E6DDF0', '#9A86B8'], kitchen: ['#FBEBC4', '#D2A64A'],
    garden: ['#DDEFE4', '#6FA08A'], arcade: ['#ECDDF4', '#A07CC0'], shop: ['#DDEFE6', '#6FA08A'], hamsters: ['#FBE6CC', '#C9924E'], fish: ['#DCEAF6', '#6F9CC7'],
    birds: ['#EEF4D6', '#94A95A'], cats: ['#F4E1EE', '#B57AA3'] };
  const roomCol = (id) => ROOM_COL[id] || ['#F6E3C8', '#C99A63'];
  const YU = (row) => DOCK_ROW - row;
  const FX = { goo: '#A58AD8', gooDark: '#7C63B8', gooTop: '#CBB8F0', fast: '#86C26F', fastDark: '#5E9A4E', danger: '#E0664A', dangerGlow: '255,110,80', spring: '#F0A04B' };
  const DANGER_KINDS = { stove: 1, cactus: 1, cat: 1 };

  // draw fn with the training ground mapped into a village tower (KM village tiles to a training tile)
  function withLevelView(L, fn) {
    const ox = cam.x, ots = cam.ts;

  // draw fn with an explicit view: centre x, tile size and the screen y of yu = 0
  function withView(cx, ts, gy, fn) {

  }

  // ---------- the level: floors, surfaces, trampolines and obstacles ----------

  function drawLevelArt(B, mode, t, vis) {

    const inView = (x0, x1, y0, y1) => !vis || (x1 > vis.x0 && x0 < vis.x1 && y1 > vis.y0 && y0 < vis.y1);

  // a prop's box in yu: bottom-left (x, yb), w by h tiles. Obstacles hang from their top row; raised props sit on the floor below.
  function propBox(p) {

  // the floor slab of one floor: planks over one-way floors, stone under the ground floor, holes left open

      let x1 = x; while (x1 < W1 && RR.at(Lv, x1, row + 1) === TL.WALL) x1++;

  // goo, speed belts: runs of surface tiles along one floor
  function surfRow(Lv, row, t, full) {

  function springArt(x, yu, t, raised) {

    if (!raised) {

  function dangerGlow(x, yb, t) {

  }
  // a star of the day's course

  }

  const P_BOX = '#D6A46A', P_TAPE = '#F3D9A8';

    dj() { tone(700, 0.1, 'triangle', 0.035, 1180); tone(1400, 0.08, 'sine', 0.02, 0, 0.05); },
    land() { tone(180, 0.05, 'sine', 0.045, 120); },
    boing() { tone(300, 0.22, 'sine', 0.045, 900); },
    shortcut() { [880, 1175, 1568].forEach((f, i) => tone(f, 0.12, 'sine', 0.032, 0, i * 0.06)); },
    bonus() { [1046, 1318, 1568, 2093].forEach((f, i) => tone(f, 0.1, 'sine', 0.032, 0, i * 0.05)); },
    fast() { tone(900, 0.12, 'triangle', 0.035, 1500); },
    goo() { tone(220, 0.18, 'sine', 0.04, 140); },
    glide() { tone(660, 0.3, 'sine', 0.02, 520); },
    star(n) { tone(1175 + n * 180, 0.14, 'sine', 0.042); tone(1760 + n * 240, 0.18, 'sine', 0.028, 0, 0.06); },
    cut() { tone(330, 0.2, 'triangle', 0.045, 160); },
    finish() { [784, 988, 1175, 1568].forEach((f, i) => tone(f, 0.22, 'sine', 0.042, 0, i * 0.08)); },
    count(go) { tone(go ? 1175 : 784, go ? 0.22 : 0.1, 'sine', 0.045); },
    medal() { [988, 1319, 1568, 1976, 2637].forEach((f, i) => tone(f, 0.3, 'sine', 0.042, 0, i * 0.09)); },
  });

  // ---------- the loop ----------
  function step(dt) {
    clock += dt;
    for (const L of lots) {
      if (!L.built) continue;
      if (L.bt < 1) {
        L.bt = Math.min(1, L.bt + dt / 1.8);
        if (Math.random() < dt * 12) puff(L.x + Math.random() * L.w, 0.2, 1);
        if (L.bt >= 1 && L.buildNew) { L.buildNew = false; confetti(L.x + L.w / 2, heightOf(L) * 0.7, 50); popup(L.x + L.w / 2, heightOf(L) + 1.5, `New ${L.def.name}!`, '#FFD27A'); sfx.done(); syncStreetLife(); dirtyCard = true; }
        continue;
      }
      const k = L.def.kind;
      if (k === 'tower') tickTower(L, dt); else if (k === 'depot') tickDepot(L, dt); else if (k === 'food') tickFood(L, dt); else if (k === 'home') tickHome(L, dt); else tickHub(L, dt);
    }
    tickTowers(dt);
    tickVisits(dt); tickStreet(dt); tickFx(dt);
  }
  let last = 0, cardT = 0, mapT = 0, birdT = 5, dayT = 0, frameDt = 0;
  function frame(t) {
    const real = Math.min(0.1, (t - last) / 1000 || 0); last = t; frameDt = real;
    for (let left = real; left > 0; left -= 0.05) step(Math.min(0.05, left));
    if (mode === 'train' && tg && !window.__pbFreeze) {
      tAcc += real; let n = 0;
      while (tAcc >= DT60 && n < 8) { tAcc -= DT60; trainTick(); n++; }
      if (n >= 8) tAcc = 0;
      trainFrame(real);
    }
    updateCam(real);
    shake = Math.max(0, shake - real * 20); moneyBump = Math.max(0, moneyBump - real);
    if (toastT > 0) { toastT -= real; if (toastT <= 0) $('toast').classList.remove('on'); }
    if (bannerT > 0) { bannerT -= real; if (bannerT <= 0) $('banner').classList.remove('on'); }
    if (mode !== 'train' && (birdT -= real) <= 0) { birdT = rand(7, 16); sfx.bird(); }
    const tier = tierOf(population());
    if (tier > S.tier) {
      S.tier = tier; banner(tier); syncStreetLife(); dirtyCard = true;
      if (TIERS[tier].move && S.moves < tier) { S.moves = tier; setTimeout(() => moveCard(tier), 3000); }
      save();
    }
    if (mode === 'train' && tg) renderTraining(t / 1000); else render(t / 1000);
    if (mode !== 'train') {
      refreshTop();
      if ((cardT -= real) <= 0 || dirtyCard) { cardT = 0.25; refreshCard(dirtyCard); dirtyCard = false; }
      if ((mapT -= real) <= 0) { mapT = 1 / 15; drawMap(t / 1000); }
    }
    if ((dayT -= real) <= 0) { dayT = 15; rollDay(); refreshStreak(); }
    if (performance.now() - saveAt > 5000) { saveAt = performance.now(); save(); }
    requestAnimationFrame(frame);
  }
  function refreshStreak() {
    const n = streakNow(), el = $('streak');
    el.innerHTML = n > 0 ? `Day streak <b>${n}</b>` : bld.some((B) => B.st.open && B.st.lesson) ? 'Daily course: <b>★★★</b>' : '';
  }

  // ---------- cards over everything: new moves, welcome back ----------
  const modalQ = [];
  function showModal(o) { modalQ.push(o); if (modalQ.length === 1) openModal(o); }
  function openModal(o) {
    $('mKicker').textContent = o.kicker || ''; $('mTitle').textContent = o.title; $('mTitle').className = o.cash ? 'cash' : ''; $('mText').textContent = o.text;
    $('mBtns').innerHTML = o.buttons.map((b, i) => `<button type="button" class="btn ${b.cls || ''}" data-i="${i}"><span>${b.label}</span>${b.sub ? `<small>${b.sub}</small>` : ''}</button>`).join('');
    drawModalIcon(o.icon);
    $('modal').hidden = false;
    setTimeout(() => { const f = $('mBtns').querySelector('button'); if (f) f.focus(); }, 30);
  }
  function closeModal(i) {
    const o = modalQ.shift(); $('modal').hidden = true;
    const b = o && o.buttons[i]; if (b && b.fn) b.fn();
    if (modalQ.length) setTimeout(() => openModal(modalQ[0]), 250);
  }
  $('mBtns').addEventListener('click', (e) => { const b = e.target.closest('button'); if (b) { ensureAudio(); sfx.tap(); closeModal(+b.dataset.i); } });
  window.addEventListener('keydown', (e) => { if (e.code === 'Escape' && !$('modal').hidden) closeModal(-1); });
  function drawModalIcon(kind) {
    const c = $('mIcon'), g = c.getContext('2d');
    g.setTransform(1, 0, 0, 1, 0, 0); g.clearRect(0, 0, c.width, c.height);
    const bg = g.createRadialGradient(96, 96, 10, 96, 96, 96); bg.addColorStop(0, '#FFF1D6'); bg.addColorStop(1, 'rgba(255,241,214,0)'); g.fillStyle = bg; g.fillRect(0, 0, 192, 192);
    const main = ctx, oW = W, oH = H; ctx = g; W = c.width; H = c.height;
    try {
      withView(0, 60, 150, () => {
        if (kind === 'dj' || kind === 'glide') {
          fillW(-2, -0.2, 4, 0.2, C.plank);
          if (kind === 'dj') { ctx.strokeStyle = '#FFF6E8'; ctx.lineWidth = 5; ctx.beginPath(); ctx.ellipse(96, 150 - 0.55 * 60, 34, 10, 0, 0, Math.PI * 2); ctx.stroke(); ctx.strokeStyle = INK; ctx.lineWidth = 2; ctx.stroke(); }
          if (kind === 'glide') umbrellaU(0.05, 1.95, 0.7, '#E27D9C');
          sprite(0, kind === 'dj' ? 0.75 : 0.3, runnerU, { air: true, glide: kind === 'glide', phase: 1 }, 1.25, false);
        } else if (kind === 'coins') {
          for (let k = 0; k < 7; k++) { const x = -0.9 + (k % 4) * 0.6 + (k > 3 ? 0.3 : 0), y = k > 3 ? 0.42 : 0; ctx.beginPath(); ctx.ellipse(sx(x), sy(y + 0.14), 0.32 * 60, 0.16 * 60, 0, 0, Math.PI * 2); inkFill('#F2C14E', 0.05); }
          sprite(1.1, 0, drawBot, { color: '#6FB39F', happy: true, flag: 1 }, 1.1, true);
        }
      });
    } finally { ctx = main; W = oW; H = oH; }
  }
  // the best tower to take a new move to: the first open one with a lesson
  const moveTower = () => bld.find((B) => B.st.open && B.st.lesson && !B.st.teach) || bld[0];
  function moveCard(tier) {
    const mv = TIERS[tier].move;
    showModal({ kicker: 'New move unlocked', icon: mv, title: mv === 'dj' ? 'Double jump' : 'Umbrella glide',
      text: mv === 'dj' ? 'Tap again in the air to jump again. From a low obstacle it reaches the floor above: shortcuts your bots can take once you show them. The Star medal opens too.'
        : 'Tap in the air and hold: your umbrella floats you down at full speed, over goo and gaps. Teach it and your bots glide too.',
      buttons: [{ label: 'Try it', sub: `in the ${moveTower().def.name}`, cls: 'gold', fn: () => startTraining(moveTower()) }, { label: 'Later', cls: 'soft' }] });
  }
  function welcomeCard(away) {
    const stale = bld.filter((B) => B.st.open && B.st.lesson && !B.st.teach && freshK(B) < 1), open = bld.filter((B) => B.st.open && B.st.lesson && !courseDone(B));
    const hrs = away.t / 3600, time = hrs >= 1 ? `${Math.floor(hrs)} hour${hrs >= 2 ? 's' : ''}${hrs % 1 > 0.08 ? ` ${Math.round((hrs % 1) * 60)} min` : ''}` : `${Math.max(1, Math.round(away.t / 60))} minutes`;
    let text = `In ${time} away your bots made ${away.deliveries.toLocaleString('en-US')} deliveries.`;
    if (stale.length) text += ` The ${stale[0].def.name}'s pay isn't fresh any more: one quick take brings back +50%.`;
    else if (open.length) text += ` Today's course is waiting: three stars on the ${open[0].def.name}'s route.`;
    const B = stale[0] || open[0];
    showModal({ kicker: 'Welcome back', icon: 'coins', title: '+' + fmt$(away.cash), cash: true, text,
      buttons: B ? [{ label: 'Collect', cls: 'soft' }, { label: 'Train', sub: B.def.name, cls: 'gold', fn: () => startTraining(B) }] : [{ label: 'Collect', cls: 'gold' }] });
  }

  // ---------- start ----------
  const saved = load();
  S = saved || fresh();
  rollDay();
  startTowers();
  S.tier = Math.max(S.tier, tierOf(population()));
  S.moves = Math.max(S.moves, S.tier);
  VILLAGE.forEach((it) => { it.g = S.tier >= it.tierMin ? 1 : 0; });
  syncStreetLife(); syncSound(); refreshStreak();
  layout();
  new ResizeObserver(() => { const v = cam.view; layout(); if (v) goView(v, true); }).observe(app);
  new ResizeObserver(panelMoved).observe(panel);
  goView('home', true);
  if (!bld[0].st.lesson) selected = lots[1];
  if (saved) {
    const away = awayEarnings((Date.now() - (S.last || Date.now())) / 1000);
    if (away) { S.money += away.cash; S.earned += away.cash; setTimeout(() => welcomeCard(away), 700); }
  }
  if (!S.seen.village) { S.seen.village = true; setTimeout(() => toast(`Welcome to ${TOWN}! The Post Office bots are waiting for their first lesson: tap Train.`, 5), 700); }
  save();
  window.addEventListener('pagehide', save);
  document.addEventListener('visibilitychange', () => { if (document.hidden) save(); });
  // the hook the browser checks use
  window.__pb = { get S() { return S; }, bld, lots, cam, build, goView, focusLot, step, startTraining, exitTraining, newTake, hireBot, buyStep, courseOf, courseDone, rateOf, freshK,
    RR, get tg() { return tg; }, get mode() { return mode; }, get pop() { return population(); }, get selected() { return selected; }, simulate, follow, analyze, abFor, mvNow, TUNE, save, load,
    setTier(t) { S.tier = t; }, get modalOpen() { return !$('modal').hidden; }, closeModal,
    runTicks(n) { for (let i = 0; i < n && tg; i++) { trainTick(); trainFrame(DT60); } } };
  requestAnimationFrame((t) => { last = t; requestAnimationFrame(frame); });

})();

</script>
