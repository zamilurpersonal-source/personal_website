<script>
// ===RULES-START===
// Pure rules. A state is { cells: Array(N*N) of stacks (bottom→top colour letters), voids: Array(N*N) of bool,
// plats: [{ cells: [idx], hidden: { idx: stack }, revealed }] }.
const RULES = (() => {
  const N = 6, CLEAR_AT = 10;
  const DIRS = [[1, 0], [-1, 0], [0, 1], [0, -1]];
  const top = s => s[s.length - 1];
  const run = s => { let n = 0; for (let i = s.length - 1; i >= 0 && s[i] === top(s); i--) n++; return n; };
  const single = s => s.length > 0 && s.every(c => c === s[0]);
  const nbrs = i => { const x = i % N, y = (i / N) | 0, out = [];
    for (const [dx, dy] of DIRS) { const nx = x + dx, ny = y + dy; if (nx >= 0 && ny >= 0 && nx < N && ny < N) out.push(ny * N + nx); } return out; };
  const clone = st => ({ ...st, cells: st.cells.map(s => s.slice()), plats: st.plats.map(p => ({ ...p })) });

  // How many coins move from a to b, or 0 if the move is not allowed.
  function moveCount(st, a, b) {
    const A = st.cells[a], B = st.cells[b];
    if (!A.length || st.voids[b]) return 0;
    const c = top(A);
    if (B.length) return single(B) && B[0] === c ? run(A) : 0;
    if (single(A)) return A.length >= 2 ? A.length - 1 : 0;              // fold: leave one coin behind
    return nbrs(b).some(q => q !== a && st.cells[q].length && top(st.cells[q]) === c) ? run(A) : 0;
  }

  function xfer(st, ev, from, to, n, combo) {
    const A = st.cells[from], B = st.cells[to];
    const coins = A.splice(A.length - n, n);
    ev.push({ type: 'xfer', from, to, coins: coins.slice(), fromLvl: A.length, toLvl: B.length, combo });
    B.push(...coins);
  }

  // Matching single-colour neighbours gather into the biggest stack, repeating from there.
  // The cell the move came from is left alone, so a fold doesn't snap straight back.
  function combine(st, ev, p, src) {
    let combo = 0;
    for (let guard = 0; guard < 40; guard++) {
      const S = st.cells[p]; if (!S.length) return;
      const c = top(S);
      const mates = nbrs(p).filter(q => q !== src && single(st.cells[q]) && st.cells[q][0] === c);
      if (!mates.length) return;
      combo++;
      const cands = (single(S) ? [p] : []).concat(mates);
      let dest = cands[0];
      for (const q of cands) if (st.cells[q].length > st.cells[dest].length) dest = q;
      for (const q of [p, ...mates]) if (q !== dest) xfer(st, ev, q, dest, run(st.cells[q]), combo);
      p = dest;
    }
  }

  function settle(st, ev) {
    for (let i = 0; i < N * N; i++) { const s = st.cells[i];
      if (s.length && run(s) >= CLEAR_AT) { const n = run(s); ev.push({ type: 'clear', at: i, color: top(s), n, lvl: s.length - n }); s.splice(s.length - n, n); } }
    st.plats.forEach((p, k) => {
      if (p.revealed || !p.cells.every(i => !st.cells[i].length)) return;
      st.plats[k] = { ...p, revealed: true };
      for (const i of p.cells) st.cells[i] = (p.hidden[i] || []).slice();
      ev.push({ type: 'reveal', plat: k, cells: p.cells.slice() });
    });
  }

  function move(st0, a, b) {
    if (!nbrs(a).includes(b)) return null;
    const n = moveCount(st0, a, b); if (!n) return null;
    const st = clone(st0), ev = [];
    xfer(st, ev, a, b, n, 0);
    combine(st, ev, b, a);
    settle(st, ev);
    return { st, ev };
  }
  const hiddenCoins = st => st.plats.reduce((t, p) => t + (p.revealed ? 0 : Object.values(p.hidden).reduce((u, s) => u + s.length, 0)), 0);
  const coins = st => st.cells.reduce((t, s) => t + s.length, 0) + hiddenCoins(st);
  const won = st => coins(st) === 0;

  // Level text → state. Rows of space-separated cells: "." empty, "#" void, "ryy" a stack (bottom→top),
  // "A:cc" a stack sitting on platform A. hidden: { A: ["gggg", ...] } in reading order of A's cells.
  function parse(L) {
    const cells = [], voids = [], groups = {};
    L.rows.forEach((row, y) => row.trim().split(/\s+/).forEach((tok, x) => {
      const i = y * N + x; let s = tok;
      voids[i] = s === '#';
      const m = /^([A-Z]):(.*)$/.exec(s);
      if (m) { (groups[m[1]] = groups[m[1]] || []).push(i); s = m[2]; }
      cells[i] = s === '.' || s === '#' || s === '' ? [] : s.split('');
    }));
    const plats = Object.keys(groups).sort().map(g => {
      const hidden = {}; groups[g].forEach((i, k) => hidden[i] = ((L.hidden || {})[g] || [])[k] ? L.hidden[g][k].split('') : []);
      return { id: g, cells: groups[g], hidden, revealed: false };
    });
    return { cells, voids, plats };
  }
  return { N, CLEAR_AT, DIRS, top, run, single, nbrs, moveCount, move, won, coins, hiddenCoins, parse, clone };
})();
// ===RULES-END===
</script>

  r: { top:'#ff6b6b', side:'#c94a4f', dark:'#8f3036', name:'red' },
  y: { top:'#ffe14d', side:'#d0ad1e', dark:'#8f7512', name:'yellow' },

// Every number a designer tunes: the time limit per level and the piggy's wish bonus.
const TUNED = {
  TIME: Object.fromEntries(LEVELS.map((l, k) => ['L' + (k + 1), l.time])),
  get WISH_BONUS() { return WISH_BONUS; }, set WISH_BONUS(v) { WISH_BONUS = v; },
};
let WISH_BONUS = 10;
const $ = id => document.getElementById(id);

// ---------- Save (stars per level; optional) ----------
const SAVE_KEY = 'zr-dollar-stack-save';
let save = { stars: {} };
try { save = JSON.parse(localStorage.getItem(SAVE_KEY)) || save; } catch (e) {}
const persist = () => { if (window.LAB_MODE) return; try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) {} };

// ---------- Art ----------
const img = src => { const i = new Image(); i.src = src; return i; };
const pigImg = img(ART.pig), bgImg = img(ART.bg), coinImg = new Image(), coinFaces = {};
coinImg.onload = () => {
  for (const [k, C] of Object.entries(COLORS)) {
    const c = document.createElement('canvas'); c.width = c.height = 128; const x = c.getContext('2d');
    x.drawImage(coinImg, 0, 0, 128, 128);
    x.globalCompositeOperation = 'multiply'; x.fillStyle = C.top; x.fillRect(0, 0, 128, 128);
    x.globalCompositeOperation = 'destination-in'; x.drawImage(coinImg, 0, 0, 128, 128);
    coinFaces[k] = c;
  }
};
coinImg.src = ART.coin;

// ---------- Game state ----------
let level = 0, L, st, disp, state = 'menu', history, sel, cursor, showCursor = false, moves, timeLeft, timeTotal;
let queue, playing, flying, parts, texts, bounces, shakes, pops, flashes, platFx, introT0, shakeT0 = 0, shakeAmp = 0;
let lastInput = 0, hint = null, wish = null, piles = [], clearedColors = 0, levelColors = [], lastCombo = 0;

function startLevel(n) {
  level = n; L = LEVELS[n]; st = parse(L); disp = st.cells.map(s => s.slice());
  state = 'play'; history = []; sel = null; cursor = { x: 0, y: 0 }; moves = 0; timeLeft = timeTotal = TUNED.TIME['L' + (n + 1)];
  queue = []; playing = false; flying = []; parts = []; texts = []; bounces = {}; shakes = {}; pops = {}; flashes = {}; platFx = {};
  piles = []; clearedColors = 0; hint = null; lastInput = performance.now();
  const all = new Set(); st.cells.forEach(s => s.forEach(c => all.add(c))); st.plats.forEach(p => Object.values(p.hidden).forEach(s => s.forEach(c => all.add(c))));
  levelColors = Object.keys(COLORS).filter(c => all.has(c));
  introT0 = performance.now();
  pig.x = .5; pig.y = .72; pig.tx = .5; pig.ty = .72; pig.belly = 0; pig.jump = 0; pig.mood = 'idle';
  pickWish();
  $('menu').style.display = 'none'; $('end').style.display = 'none';
  $('lvlName').textContent = `${n + 1}. ${L.name}`;
  $('help').textContent = L.tip;
  toast(L.tip, 4200);
  hud(); sfx('start');
}

function boardColors() { const s = new Set(); st.cells.forEach(c => c.forEach(x => s.add(x))); return [...s]; }
function pickWish() {
  const cols = boardColors().filter(c => c !== (wish && wish.c));
  const pool = cols.length ? cols : boardColors();
  wish = pool.length ? { c: pool[Math.floor(labRand() * pool.length)], t0: performance.now() } : null;
}

function tryMove(a, dx, dy) {
  if (state !== 'play' || busy()) return false;
  lastInput = performance.now(); hint = null;
  const x = a % N + dx, y = ((a / N) | 0) + dy;
  if (x < 0 || y < 0 || x >= N || y >= N) return bump(a, null);
  const b = y * N + x, r = move(st, a, b);
  if (!r) return bump(a, b);
  history.push({ st: clone(st), moves, timeBonus: 0 });
  st = r.st; moves++; sel = null; lastCombo = 0;
  queue.push(...r.ev); next();
  return true;
}
function bump(a, b) {
  shakes[a] = performance.now(); if (b != null && !st.voids[b]) flashes[b] = { t: performance.now(), bad: true };
  sfx('bump'); buzz(30); return false;
}

// ---------- Event playback ----------
function next() {
  const e = queue.shift();
  if (!e) { playing = false; hud(); if (won(st)) win(); return; }
  playing = true;
  const now = performance.now();
  if (e.type === 'xfer') {
    disp[e.from].splice(disp[e.from].length - e.coins.length);
    bounces[e.from] = now;
    const n = e.coins.length, gap = e.combo ? 28 : 38;
    if (e.combo && e.combo !== lastCombo) { lastCombo = e.combo; const c = center(e.to); floatText(e.combo > 1 ? `Combo x${e.combo}!` : 'Combo!', c.x, c.y - cell * .6, '#ffd34d', 18); sfx('combo', e.combo); }
    e.coins.forEach((c, k) => flying.push({ c, a: { i: e.from, lvl: e.fromLvl + k }, b: { i: e.to, lvl: e.toLvl + k }, t0: now + k * gap, dur: 230, spin: true,
      land() {
        disp[e.to].push(c); bounces[e.to] = performance.now(); sfx('clink', k);
        const p = coinPos(e.to, e.toLvl + k); dust(p.x, p.y, COLORS[c].top, 3);
        if (k === n - 1) setTimeout(next, 40);
      } }));
  } else if (e.type === 'clear') {
    flashes[e.at] = { t: now }; const c0 = center(e.at);
    floatText(`+${e.n}`, c0.x, c0.y - cell * .5, '#fff', 26);
    sfx('clear'); buzz([20, 30, 40]); shake(6);
    setTimeout(() => {
      disp[e.at].splice(disp[e.at].length - e.n);
      const t1 = performance.now();
      for (let k = 0; k < e.n; k++) {
        const lvl = e.lvl + e.n - 1 - k;
        flying.push({ c: e.color, a: { i: e.at, lvl }, b: 'pig', t0: t1 + k * 55, dur: 600, spin: true, bank: true,
          land() {
            pig.chomp = performance.now(); sfx('chomp', k);
            if (k === e.n - 1) {
              clearedColors++; pig.belly = Math.min(1, pig.belly + .2); burstAtPig(e.color); addPile(e.color, e.n);
              if (wish && wish.c === e.color) grantWish(); else if (wish && !boardColors().includes(wish.c)) pickWish();
              hud(); setTimeout(next, 80);
            }
          } });
      }
    }, 220);
  } else if (e.type === 'reveal') {
    sfx('rumble'); shake(8); buzz([40, 40, 60]);
    e.cells.forEach(i => platFx[i] = now);
    const c0 = center(e.cells[0]); floatText('Hidden coins!', c0.x, c0.y - cell * .7, '#d9c6ff', 22);
    setTimeout(() => {
      e.cells.forEach((i, k) => setTimeout(() => {
        disp[i] = st.cells[i].slice(); pops[i] = performance.now(); sfx('pop', k);
        const c = center(i); for (let j = 0; j < 14; j++) parts.push(dustP(c.x, c.y + cell * .2, '#cbb8ff'));
      }, k * 140));
      setTimeout(next, e.cells.length * 140 + 300);
    }, 420);
  }
}

function grantWish() {
  timeLeft += WISH_BONUS; timeTotal += WISH_BONUS;
  const p = pigPos(); floatText(`Wish granted! +${WISH_BONUS}s`, p.x, p.y - pigSize().h - 10, '#7dffa0', 18);
  for (let k = 0; k < 8; k++) parts.push({ x: p.x + (Math.random() - .5) * 40, y: p.y - pigSize().h * .6, vx: (Math.random() - .5) * 2, vy: -2 - Math.random() * 2, g: -.02, life: 1.4, heart: true, size: 10 + Math.random() * 8, col: '#ff6fae' });
  pig.jump = performance.now(); sfx('wish');
  $('time').classList.add('bonus'); setTimeout(() => $('time').classList.remove('bonus'), 900);
  pickWish();
}

function undo() {
  if (busy() || state !== 'play' || !history.length) return;
  const h = history.pop(); st = h.st; moves = h.moves; disp = st.cells.map(s => s.slice()); sel = null;
  if (wish && !boardColors().includes(wish.c)) pickWish();
  sfx('undo'); hud();
}

// ---------- End states ----------
function starsFor(left, total) { const f = left / total; return f >= .45 ? 3 : f >= .2 ? 2 : 1; }
function win() {
  state = 'won'; pig.jump = performance.now(); sfx('win'); confetti();
  const stars = starsFor(timeLeft, timeTotal);
  save.stars[level] = Math.max(save.stars[level] || 0, stars); persist();
  setTimeout(() => {
    $('stars').innerHTML = [0, 1, 2].map(k => `<span class="${k < stars ? 'on' : ''}" style="animation-delay:${k * .18 + .1}s">★</span>`).join('');
    $('endTitle').textContent = level === LEVELS.length - 1 ? 'Piggy is full!' : 'Board cleared!';
    $('endText').textContent = `${moves} moves · ${fmt(timeTotal - timeLeft)} · par ${L.par}`;
    $('endNext').style.display = level < LEVELS.length - 1 ? '' : 'none';
    $('endNext').textContent = 'Next ▶';
    $('end').style.display = 'flex';
    for (let k = 0; k < stars; k++) setTimeout(() => sfx('star', k), 250 + k * 180);
  }, 900);
}
function lose() {
  state = 'lost'; sfx('lose'); pig.mood = 'sad';
  setTimeout(() => {
    $('stars').innerHTML = '<span>★</span><span>★</span><span>★</span>';
    $('endTitle').textContent = "Time's up";
    $('endText').textContent = `${coins(st)} coins were still on the board.`;
    $('endNext').style.display = 'none';
    $('end').style.display = 'flex';
  }, 700);
}
function showMenu() {
  if (state === 'play' && busy()) return;
  state = 'menu';
  const nextUp = LEVELS.findIndex((_, k) => !save.stars[k]);
  $('grid').innerHTML = LEVELS.map((l, k) => `<button class="lvl ${k === nextUp ? 'next' : ''}" data-k="${k}"><b>${k + 1}</b><small>${'★'.repeat(save.stars[k] || 0)}</small></button>`).join('');
  $('grid').querySelectorAll('button').forEach(b => b.onclick = () => startLevel(+b.dataset.k));
  $('end').style.display = 'none'; $('menu').style.display = 'flex';
}
const fmt = s => `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(Math.floor(s % 60)).padStart(2, '0')}`;
function hud() {
  if (!st) return;
  const t = $('time'); t.textContent = fmt(Math.ceil(timeLeft)); t.classList.toggle('low', timeLeft <= 15 && state === 'play');
  $('left').textContent = coins(st);
}
let toastTimer = 0;
function toast(msg, ms = 2500) { const t = $('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), ms); }

// ---------- Sound and haptics ----------
let ac = null, muted = false, audioOK = false;
// browsers block sound until the first tap or key press, so the audio starts then
const unlockAudio = () => { audioOK = true; try { ac = ac || new (window.AudioContext || window.webkitAudioContext)(); if (ac.state === 'suspended') ac.resume(); } catch (e) {} };
addEventListener('pointerdown', unlockAudio, true); addEventListener('keydown', unlockAudio, true);
function tone(freq, dur, type = 'triangle', vol = .12, when = 0, slide = 0) {
  if (muted || !audioOK) return;

    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    const t = ac.currentTime + when, o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t); if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, freq * slide), t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.001, t + dur);
    o.connect(g).connect(ac.destination); o.start(t); o.stop(t + dur);
  } catch (e) {}
}
function sfx(name, k = 0) {
  switch (name) {
    case 'clink': tone(1300 + k * 90, .05, 'triangle', .08); tone(2600 + k * 120, .04, 'sine', .04, .01); break;
    case 'select': tone(520, .06, 'triangle', .1, 0, 1.4); break;
    case 'bump': tone(160, .1, 'square', .08, 0, .6); break;
    case 'combo': [0, 1, 2].forEach(j => tone(660 * Math.pow(1.26, j + k), .09, 'triangle', .1, j * .05)); break;
    case 'clear': tone(523, .1, 'triangle', .12); tone(784, .14, 'triangle', .12, .08); tone(1046, .2, 'triangle', .12, .16); break;
    case 'chomp': tone(900 + k * 60, .05, 'sine', .07); if (k % 3 === 0) tone(140, .06, 'square', .05); break;
    case 'rumble': tone(70, .5, 'sawtooth', .1, 0, .7); tone(110, .4, 'square', .05, .05, 1.8); break;
    case 'pop': tone(400 + k * 120, .12, 'sine', .12, 0, 2); break;
    case 'wish': [0, 1, 2, 3].forEach(j => tone(880 * Math.pow(1.19, j), .12, 'sine', .1, j * .06)); break;
    case 'oink': tone(260, .12, 'sawtooth', .07, 0, .7); tone(240, .12, 'sawtooth', .06, .14, .7); break;
    case 'undo': tone(500, .08, 'triangle', .08, 0, .6); break;
    case 'start': tone(392, .1, 'triangle', .1); tone(523, .14, 'triangle', .1, .1); break;
    case 'tick': tone(1800, .03, 'square', .03); break;
    case 'star': tone(880 * Math.pow(1.25, k), .25, 'triangle', .12); break;
    case 'win': [0, 1, 2, 3, 4].forEach(j => tone(523 * Math.pow(1.122, j * 2), .18, 'triangle', .12, j * .09)); break;

}
const buzz = p => { try { navigator.vibrate && navigator.vibrate(p); } catch (e) {} };

// ---------- Layout ----------
const cv = $('c'), ctx = cv.getContext('2d');
let W, H, cell, bx, by, pen;
const pig = { x: .5, y: .72, tx: .5, ty: .72, wait: 0, face: 1, moving: false, chomp: 0, jump: 0, belly: 0, mood: 'idle', tapT: 0 };
function layout() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  cv.width = W * dpr; cv.height = H * dpr; cv.style.width = W + 'px'; cv.style.height = H + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const topY = 60, bottom = 112, avail = H - topY - bottom;
  const B = Math.min(W - 32, 470, avail * .66);
  cell = B / N;
  const penH = Math.max(90, Math.min(avail - B - 22, B * .5));
  const penW = Math.min(W - 16, B + 20);
  pen = { x: (W - penW) / 2, y: topY + Math.max(0, (avail - B - penH - 22) / 2), w: penW, h: penH };
  bx = (W - B) / 2; by = pen.y + penH + 22;
  $('toast').style.top = (by + 6) + 'px';   // tips sit over the board's top edge, clear of the pen
}
addEventListener('resize', layout);

const center = i => ({ x: bx + (i % N + .5) * cell, y: by + (((i / N) | 0) + .5) * cell });
const coinPos = (i, lvl, sy = 1) => { const c = center(i); return { x: c.x, y: c.y + cell * .12 - lvl * cell * .065 * sy }; };
const pigPos = () => ({ x: pen.x + pig.x * pen.w, y: pen.y + pig.y * pen.h });
function pigSize() { const depth = .8 + (pig.y - .6) * 1.2, w = pen.h * .5 * depth * (1 + pig.belly * .15); return { w, h: w * .95 }; }

// ---------- Effects ----------
const ease = { outBack: t => 1 + 2.7 * Math.pow(t - 1, 3) + 1.7 * Math.pow(t - 1, 2), inOut: t => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2,
  outElastic: t => t === 0 || t === 1 ? t : Math.pow(2, -10 * t) * Math.sin((t * 10 - .75) * 2 * Math.PI / 3) + 1 };

function floatText(text, x, y, col, size) { texts.push({ text, x, y, col, size, t0: performance.now() }); }
const dustP = (x, y, col) => ({ x, y, vx: (Math.random() - .5) * 3, vy: -Math.random() * 2.5, g: .12, life: .8, size: 2 + Math.random() * 3, col, round: true });
function dust(x, y, col, n) { for (let k = 0; k < n; k++) parts.push(dustP(x, y, col)); }
function burstAtPig(col) {
  const p = pigPos(), h = pigSize().h;
  for (let k = 0; k < 30; k++) { const a = Math.random() * Math.PI * 2, s = 2 + Math.random() * 4;
    parts.push({ x: p.x, y: p.y - h * .8, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 2, g: .15, life: 1.1, size: 3 + Math.random() * 4, col: k % 3 ? COLORS[col].top : '#fff', spin: Math.random() * 6 }); }
}
function confetti() {
  const cols = Object.values(COLORS).map(c => c.top).concat('#fff');
  for (let k = 0; k < 140; k++) parts.push({ x: Math.random() * W, y: -20 - Math.random() * H * .4, vx: (Math.random() - .5) * 2, vy: 1 + Math.random() * 3, g: .04,
    life: 3 + Math.random(), size: 5 + Math.random() * 5, col: cols[k % cols.length], spin: Math.random() * 10, rect: true });
}
function addPile(col, n) {
  const floorY = .62 + Math.random() * .1, x = .1 + Math.random() * .8;
  piles.push({ c: col, x, y: floorY, n: Math.min(6, Math.round(n / 2)), t0: performance.now() });
}

// ---------- Drawing ----------
function rr(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }
function cellRect(i, inset = 3) { rr(bx + (i % N) * cell + inset, by + ((i / N) | 0) * cell + inset, cell - inset * 2, cell - inset * 2, 6); }

function drawCoin(px, py, col, isTop, scale = 1, sx = 1) {
  const r = cell * .36 * scale, rx = r * sx, ry = r * .55, th = cell * .065 * scale, C = COLORS[col];
  ctx.fillStyle = C.dark; ctx.beginPath(); ctx.ellipse(px, py + th, rx, ry, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = C.side; ctx.fillRect(px - rx, py, rx * 2, th);
  ctx.fillStyle = C.top; ctx.beginPath(); ctx.ellipse(px, py, rx, ry, 0, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = C.side; ctx.lineWidth = 1; ctx.stroke();
  if (isTop && coinFaces[col]) ctx.drawImage(coinFaces[col], px - rx, py - ry, rx * 2, ry * 2);
}
function drawBadge(px, py, n, s = 1) {
  const r = cell * .13 * s;
  ctx.fillStyle = '#1b1b28'; ctx.beginPath(); ctx.arc(px, py, r, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.font = `bold ${r * 1.15}px system-ui`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(n, px, py + 1);
}

function drawPen(now) {
  ctx.save(); rr(pen.x, pen.y, pen.w, pen.h, 12); ctx.clip();
  if (bgImg.complete && bgImg.naturalWidth) {
    const s = Math.max(pen.w / bgImg.naturalWidth, pen.h / bgImg.naturalHeight), w = bgImg.naturalWidth * s, h = bgImg.naturalHeight * s;
    ctx.drawImage(bgImg, pen.x + (pen.w - w) / 2, pen.y + (pen.h - h) * .6, w, h);
  } else { ctx.fillStyle = '#44445e'; ctx.fillRect(pen.x, pen.y, pen.w, pen.h); }
  const g = ctx.createLinearGradient(0, pen.y, 0, pen.y + pen.h); g.addColorStop(0, 'rgba(20,20,31,.55)'); g.addColorStop(.35, 'rgba(20,20,31,0)');
  ctx.fillStyle = g; ctx.fillRect(pen.x, pen.y, pen.w, pen.h);
  // coin piles the pig has banked
  for (const p of piles.slice().sort((a, b) => a.y - b.y)) {
    const t = Math.min(1, (now - p.t0) / 500), px = pen.x + p.x * pen.w, py = pen.y + p.y * pen.h, sc = pen.h / 520;
    for (let k = 0; k < p.n; k++) { const off = (k % 3 - 1) * 9 * sc * 4, lift = Math.floor(k / 3) * 7 * sc * 4;
      const drop = (1 - ease.outBack(t)) * 40;
      ctx.save(); ctx.translate(px + off, py - lift - drop); ctx.scale(sc * 4 * .9, sc * 4 * .9);
      const C = COLORS[p.c]; ctx.fillStyle = C.dark; ctx.beginPath(); ctx.ellipse(0, 3, 9, 5, 0, 0, 7); ctx.fill();
      ctx.fillStyle = C.top; ctx.beginPath(); ctx.ellipse(0, 0, 9, 5, 0, 0, 7); ctx.fill(); ctx.restore(); }
  }
  drawPig(now);
  drawJars();
  ctx.restore();
  ctx.strokeStyle = 'rgba(255,255,255,.08)'; ctx.lineWidth = 2; rr(pen.x, pen.y, pen.w, pen.h, 12); ctx.stroke();
}

function drawJars() {
  // coins left per colour (board + still underground); a colour only found underground shows as "?"
  const board = {}, under = {};
  st.cells.forEach(s => s.forEach(c => board[c] = (board[c] || 0) + 1));
  st.plats.forEach(p => { if (!p.revealed) Object.values(p.hidden).forEach(s => s.forEach(c => under[c] = (under[c] || 0) + 1)); });
  const r = Math.min(13, pen.h * .1); let x = pen.x + 10 + r, y = pen.y + 8 + r;
  ctx.font = `bold ${r * .95}px system-ui`; ctx.textBaseline = 'middle'; ctx.textAlign = 'left';
  for (const c of levelColors) {
    const n = (board[c] || 0) + (under[c] || 0), mystery = !board[c] && under[c];
    ctx.fillStyle = 'rgba(15,15,25,.6)'; rr(x - r - 3, y - r - 3, r * 2 + 30, r * 2 + 6, r + 3); ctx.fill();
    ctx.globalAlpha = mystery ? .35 : n ? 1 : .55;
    ctx.fillStyle = COLORS[c].top; ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill();
    ctx.globalAlpha = 1;
    ctx.fillStyle = n ? '#fff' : '#7dffa0'; ctx.fillText(mystery ? '?' : n || '✓', x + r + 5, y + 1);
    x += r * 2 + 36;
  }
}

function drawPig(now) {
  const p = pigPos(), { w, h } = pigSize();
  // jump and chomp squash
  let jy = 0, sx = 1, sy = 1;
  const jt = (now - pig.jump) / 550; if (jt < 1) { jy = -Math.sin(jt * Math.PI) * h * .45; sy = 1 + Math.sin(jt * Math.PI) * .08; sx = 2 - sy; }
  const ct = (now - pig.chomp) / 160; if (ct < 1) { sy *= 1 - Math.sin(ct * Math.PI) * .12; sx *= 1 + Math.sin(ct * Math.PI) * .1; }
  const tt = (now - pig.tapT) / 400; if (tt < 1) { sx *= 1 + Math.sin(tt * Math.PI * 3) * .08 * (1 - tt); }
  const bob = pig.moving ? Math.abs(Math.sin(now / 110)) * -3 : Math.sin(now / 600) * 1.2;
  // shadow
  ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.beginPath(); ctx.ellipse(p.x, p.y, w * .36 * (1 + jy / h * .4), w * .08, 0, 0, 7); ctx.fill();
  if (pigImg.complete && pigImg.naturalWidth) {
    ctx.save(); ctx.translate(p.x, p.y + jy + bob); ctx.scale(pig.face * sx, sy);
    if (pig.mood === 'sad') ctx.filter = 'saturate(.4) brightness(.8)';
    ctx.drawImage(pigImg, -w / 2, -h, w, h); ctx.restore(); ctx.filter = 'none';

  if (state === 'play' && timeLeft < 20) { const d = (now / 700) % 1; ctx.fillStyle = 'rgba(140,210,255,.9)';
    ctx.beginPath(); ctx.ellipse(headX + pig.face * w * .12, headY + d * h * .3, 3, 5, 0, 0, 7); ctx.fill(); }
  // sleepy when the player has been idle a while
  if (pig.mood === 'sleep') { ctx.fillStyle = '#e9e4ff'; ctx.font = `bold ${h * .18}px system-ui`; ctx.textAlign = 'center';
    for (let k = 0; k < 3; k++) { const t = ((now / 1400) + k / 3) % 1; ctx.globalAlpha = 1 - t; ctx.fillText('z', headX + t * 18 * pig.face, headY - t * 26); } ctx.globalAlpha = 1; }
  // wish bubble
  if (wish && state === 'play') {
    const wt = Math.min(1, (now - wish.t0) / 400), s = ease.outBack(wt), bxp = p.x - pig.face * w * .62, byp = p.y + jy - h * .72, rb = Math.min(pen.h * .17, 22) * s;
    if (rb > 1) {
      ctx.fillStyle = 'rgba(255,255,255,.92)';
      ctx.beginPath(); ctx.arc(p.x - pig.face * w * .3, p.y + jy - h * .62, 3 * s, 0, 7); ctx.fill();
      ctx.beginPath(); ctx.arc(p.x - pig.face * w * .4, p.y + jy - h * .7, 5 * s, 0, 7); ctx.fill();
      ctx.beginPath(); ctx.arc(bxp, byp - rb * .4, rb, 0, 7); ctx.fill();
      const pulse = 1 + Math.sin(now / 250) * .06;
      ctx.fillStyle = COLORS[wish.c].dark; ctx.beginPath(); ctx.ellipse(bxp, byp - rb * .4 + 2, rb * .62 * pulse, rb * .62 * pulse, 0, 0, 7); ctx.fill();
      ctx.fillStyle = COLORS[wish.c].top; ctx.beginPath(); ctx.arc(bxp, byp - rb * .4, rb * .6 * pulse, 0, 7); ctx.fill();
      if (coinFaces[wish.c]) ctx.drawImage(coinFaces[wish.c], bxp - rb * .6 * pulse, byp - rb * .4 - rb * .6 * pulse, rb * 1.2 * pulse, rb * 1.2 * pulse);
    }
  }
}

function draw(now) {
  ctx.clearRect(0, 0, W, H);
  ctx.save();
  const st_ = (now - shakeT0) / 350;
  if (st_ < 1) ctx.translate((Math.random() - .5) * shakeAmp * (1 - st_), (Math.random() - .5) * shakeAmp * (1 - st_));
  if (st) drawPen(now);

  const B = cell * N;
  ctx.fillStyle = '#2a2a42'; rr(bx - 10, by - 2, B + 20, B + 20, 14); ctx.fill();
  ctx.fillStyle = '#3d3d58'; rr(bx - 10, by - 10, B + 20, B + 20, 14); ctx.fill();
  if (!st) { ctx.restore(); return; }
  for (let i = 0; i < N * N; i++) {
    if (st.voids[i]) { ctx.fillStyle = '#26263a'; cellRect(i, 2); ctx.fill(); continue; }
    ctx.fillStyle = (i % N + ((i / N) | 0)) % 2 ? '#4a4a66' : '#4f4f6c'; cellRect(i); ctx.fill();
    const f = flashes[i]; if (f) { const t = (now - f.t) / 300; if (t > 1) delete flashes[i];
      else { ctx.fillStyle = f.bad ? `rgba(255,90,90,${.45 * (1 - t)})` : `rgba(255,255,255,${.6 * (1 - t)})`; cellRect(i); ctx.fill(); } }
  }
  // underground platforms
  st.plats.forEach(p => p.cells.forEach(i => {
    const fx = platFx[i], t = fx ? Math.min(1, (now - fx) / 500) : 0;
    if (p.revealed && t >= 1) return;
    const lift = Math.sin(t * Math.PI) * 6, glow = .5 + Math.sin(now / 400) * .15;
    ctx.fillStyle = `rgba(150,120,210,${(.5 + glow * .3) * (1 - t)})`; cellRect(i); ctx.fill();
    ctx.strokeStyle = `rgba(215,195,255,${.9 * (1 - t)})`; ctx.setLineDash([5, 4]); ctx.lineDashOffset = -now / 60; ctx.lineWidth = 2; cellRect(i, 5); ctx.stroke(); ctx.setLineDash([]);
    if (fx) { ctx.fillStyle = `rgba(230,215,255,${.6 * (1 - t)})`; const c = center(i); ctx.fillRect(c.x - cell * .4, c.y - cell * 2 * t - lift, cell * .8, cell * 2 * t); }
    if (!disp[i].length && !p.revealed) { const c = center(i); ctx.fillStyle = 'rgba(235,225,255,.8)'; ctx.font = `bold ${cell * .3}px system-ui`;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('?', c.x, c.y); }
  }));

  // selection, legal targets and hint
  const pulse = .5 + Math.sin(now / 160) * .5;
  if (sel != null) {
    for (const b of nbrs(sel)) if (moveCount(st, sel, b)) {
      ctx.fillStyle = `rgba(255,211,77,${.14 + pulse * .14})`; cellRect(b); ctx.fill();
      const a = center(sel), c = center(b), dx = Math.sign(c.x - a.x), dy = Math.sign(c.y - a.y), ax = c.x - dx * cell * .3, ay = c.y - dy * cell * .3;
      ctx.fillStyle = 'rgba(255,211,77,.9)'; ctx.beginPath();
      ctx.moveTo(ax + dx * 8, ay + dy * 8); ctx.lineTo(ax - dy * 6 - dx * 2, ay + dx * 6 - dy * 2); ctx.lineTo(ax + dy * 6 - dx * 2, ay - dx * 6 - dy * 2); ctx.fill();
    }
    ctx.strokeStyle = '#ffd34d'; ctx.lineWidth = 3; cellRect(sel); ctx.stroke();
  }
  if (hint) { ctx.strokeStyle = `rgba(125,255,160,${.4 + pulse * .5})`; ctx.lineWidth = 3; cellRect(hint.a); ctx.stroke(); cellRect(hint.b, 8); ctx.stroke(); }
  if (showCursor) { ctx.strokeStyle = 'rgba(255,255,255,.6)'; ctx.setLineDash([5, 4]); ctx.lineWidth = 2; cellRect(cursor.y * N + cursor.x, 6); ctx.stroke(); ctx.setLineDash([]); }

  // stacks
  const it = now - introT0;
  for (let i = 0; i < N * N; i++) {
    const s = disp[i]; if (!s.length) continue;
    let ox = 0, oy = 0, sc = 1, sy = 1;
    const sh = shakes[i]; if (sh) { const t = (now - sh) / 280; if (t > 1) delete shakes[i]; else ox = Math.sin(t * Math.PI * 5) * 6 * (1 - t); }
    const bo = bounces[i]; if (bo) { const t = (now - bo) / 320; if (t > 1) delete bounces[i]; else sy = 1 - Math.sin(t * Math.PI * 2) * .14 * (1 - t); }
    const po = pops[i]; if (po) { const t = (now - po) / 600; if (t > 1) delete pops[i]; else sc = ease.outElastic(t); }
    const delay = (((i / N) | 0) + (i % N)) * 45, dt = (it - delay) / 450;
    if (dt < 1) { if (dt <= 0) continue; oy = -(1 - ease.outBack(dt)) * cell * 3; }
    if (sel === i) oy -= cell * .1 + Math.sin(now / 180) * cell * .03;
    for (let k = 0; k < s.length; k++) { const p = coinPos(i, k * sc, sy); drawCoin(p.x + ox, p.y + oy, s[k], k === s.length - 1, sc); }
    const p = coinPos(i, (s.length - 1) * sc, sy); drawBadge(p.x + ox, p.y + oy - cell * .26 * sc, s.length, sc);
  }

  // flying coins

    if (now < f.t0) continue;
    const t = Math.min(1, (now - f.t0) / f.dur), a = coinPos(f.a.i, f.a.lvl);
    let b; if (f.b === 'pig') { const q = pigPos(), ps = pigSize(); b = { x: q.x - pig.face * ps.w * .05, y: q.y - ps.h * .85 }; } else b = coinPos(f.b.i, f.b.lvl);
    const e = ease.inOut(t), arc = (f.bank ? cell * 1.6 : cell * .6) * Math.sin(Math.PI * t);
    const sx = f.spin ? Math.max(.15, Math.abs(Math.cos(t * Math.PI * (f.bank ? 3 : 1.5)))) : 1;
    const x = a.x + (b.x - a.x) * e, y = a.y + (b.y - a.y) * e - arc;
    if (f.bank && Math.random() < .3) parts.push({ x, y, vx: 0, vy: 0, g: 0, life: .35, size: 3, col: '#fff7c2', round: true });
    drawCoin(x, y, f.c, true, f.bank ? 1 - t * .5 : 1, sx);
  }

  // particles
  for (const p of parts) {
    ctx.globalAlpha = Math.max(0, Math.min(1, p.life)); ctx.fillStyle = p.col;
    if (p.heart) { ctx.font = `${p.size}px system-ui`; ctx.textAlign = 'center'; ctx.fillText('❤', p.x, p.y); }
    else if (p.round) { ctx.beginPath(); ctx.arc(p.x, p.y, p.size / 2, 0, 7); ctx.fill(); }
    else { ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.spin * p.life); ctx.fillRect(-p.size / 2, -p.size / (p.rect ? 4 : 2), p.size, p.size / (p.rect ? 2 : 1)); ctx.restore(); }
  }
  ctx.globalAlpha = 1;
  // floating texts
  for (const t of texts) {
    const k = (now - t.t0) / 1100; if (k > 1) continue;
    const s = ease.outBack(Math.min(1, k * 3));
    ctx.save(); ctx.translate(t.x, t.y - k * 40); ctx.scale(s, s); ctx.globalAlpha = 1 - Math.max(0, k - .6) / .4;
    ctx.font = `800 ${t.size}px system-ui`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(20,20,31,.85)'; ctx.strokeText(t.text, 0, 0); ctx.fillStyle = t.col; ctx.fillText(t.text, 0, 0);
    ctx.restore();
  }

  ctx.restore();
}

// ---------- Loop ----------
let last = performance.now(), lastTick = 0;
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  if (state === 'play' && now > introT0 + introDur()) {
    const before = Math.ceil(timeLeft);
    timeLeft = Math.max(0, timeLeft - dt);
    if (Math.ceil(timeLeft) !== before) { hud(); if (timeLeft <= 10 && timeLeft > 0) sfx('tick'); }
    if (timeLeft <= 0 && !busy()) lose();
    const idle = now - lastInput;
    pig.mood = idle > 12000 ? 'sleep' : 'idle';
    if (idle > 9000 && !hint && !busy()) hint = findHint();
  }
  for (let i = flying.length - 1; i >= 0; i--) { const f = flying[i]; if (now >= f.t0 + f.dur) { flying.splice(i, 1); f.land(); } }
  // pig wanders the vault floor; faster when time is short
  pig.wait -= dt;
  const dx = pig.tx - pig.x, dy = pig.ty - pig.y, d = Math.hypot(dx, dy);
  pig.moving = d > .01 && pig.mood !== 'sleep';
  if (pig.moving) { const sp = Math.min(d, (timeLeft < 20 && state === 'play' ? .32 : .16) * dt); pig.x += dx / d * sp; pig.y += dy / d * sp; if (Math.abs(dx) > .004) pig.face = dx > 0 ? 1 : -1; }
  else if (pig.wait <= 0) { pig.tx = .15 + Math.random() * .7; pig.ty = .64 + Math.random() * .2; pig.wait = 1 + Math.random() * 2.5; }
  for (let i = parts.length - 1; i >= 0; i--) { const p = parts[i]; p.x += p.vx; p.y += p.vy; p.vy += p.g; p.life -= dt * (p.rect ? .5 : 1.2); if (p.life <= 0 || p.y > H + 20) parts.splice(i, 1); }
  draw(now);
  requestAnimationFrame(frame);
}

function findHint() {
  let best = null;
  for (let a = 0; a < N * N; a++) { if (!st.cells[a].length) continue;
    for (const b of nbrs(a)) { const n = moveCount(st, a, b); if (!n) continue;
      const score = (st.cells[b].length ? 10 + st.cells[b].length + n : n);
      if (!best || score > best.score) best = { a, b, score }; } }
  return best;
}

// ---------- Input ----------
// Swipe only: press on a stack and swipe toward a neighbour. The move fires as soon as the finger
// travels far enough, so there is no separate tap to select. Pressing lifts the stack and marks its legal targets.
function cellAt(px, py) {
  const x = Math.floor((px - bx) / cell), y = Math.floor((py - by) / cell);
  return x >= 0 && y >= 0 && x < N && y < N ? y * N + x : null;
}
let down = null, idleTaps = 0, tapTipShown = false;
const swipeDir = (mx, my) => Math.abs(mx) > Math.abs(my) ? [Math.sign(mx), 0] : [0, Math.sign(my)];
function trySwipe(e) {
  const d = down, mx = e.clientX - d.x, my = e.clientY - d.y;
  if (d.done || d.i == null || !disp[d.i].length || Math.hypot(mx, my) < cell * .28) return;
  if (busy()) return;   // still animating: keep the swipe alive and try again on the next move or on release
  d.done = true; idleTaps = 0;
  const [dx, dy] = swipeDir(mx, my);
  tryMove(d.i, dx, dy); sel = null;
}
cv.addEventListener('pointerdown', e => {
  if (down && down.id !== e.pointerId) return;   // ignore a second finger
  down = { id: e.pointerId, x: e.clientX, y: e.clientY, i: cellAt(e.clientX, e.clientY), done: false }; showCursor = false;
  if (state !== 'play') return;
  lastInput = performance.now(); hint = null; if (pig.mood === 'sleep') pig.mood = 'idle';
  if (down.i != null && st.cells[down.i].length && !busy()) { sel = down.i; sfx('select'); bounces[sel] = performance.now(); buzz(8); }
  else sel = null;
});
addEventListener('pointermove', e => { if (down && down.id === e.pointerId && state === 'play') trySwipe(e); });
addEventListener('pointercancel', e => { if (down && down.id === e.pointerId) { down = null; sel = null; } });
addEventListener('pointerup', e => {
  if (!down || down.id !== e.pointerId) return; const d = down;
  if (state === 'play') trySwipe(e);
  down = null; sel = null;
  if (state !== 'play' || d.done || Math.hypot(e.clientX - d.x, e.clientY - d.y) > cell * .28) return;
  // a tap: poke the pig, or remind the player that stacks move by swiping
  const pp = pigPos(), ps = pigSize();
  if (Math.abs(e.clientX - pp.x) < ps.w * .5 && e.clientY < pp.y && e.clientY > pp.y - ps.h) {
    pig.tapT = performance.now(); pig.jump = performance.now(); sfx('oink'); if (wish) toast(`Piggy wants ${COLORS[wish.c].name}! Clear it for +${WISH_BONUS}s.`, 2200); return;
  }
  if (d.i != null && st.cells[d.i].length && ++idleTaps >= 2 && !tapTipShown) { tapTipShown = true; toast('Swipe a stack toward a neighbour to move it.', 2600); }
});
addEventListener('keydown', e => {
  const dirs = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1], a: [-1, 0], d: [1, 0], w: [0, -1], s: [0, 1] };
  if (state === 'menu') return;
  if (e.key === 'z' || e.key === 'Z' || e.key === 'Backspace') { undo(); return; }
  if (e.key === 'r' || e.key === 'R') { startLevel(level); return; }
  if (state !== 'play') { if (e.key === 'Enter' || e.key === ' ') state === 'won' && level < LEVELS.length - 1 ? startLevel(level + 1) : startLevel(level); return; }
  lastInput = performance.now(); hint = null;
  const dir = dirs[e.key];
  if (dir) {
    e.preventDefault(); showCursor = true;
    if (sel != null) { const from = sel; if (tryMove(from, dir[0], dir[1])) cursor = { x: from % N + dir[0], y: ((from / N) | 0) + dir[1] }; }
    else cursor = { x: Math.max(0, Math.min(N - 1, cursor.x + dir[0])), y: Math.max(0, Math.min(N - 1, cursor.y + dir[1])) };
  } else if (e.key === ' ' || e.key === 'Enter') {
    e.preventDefault(); showCursor = true;
    const i = cursor.y * N + cursor.x;
    sel = sel != null ? null : (st.cells[i].length ? i : null);
    if (sel != null) { sfx('select'); bounces[i] = performance.now(); }
  } else if (e.key === 'Escape') sel = null;
});
$('undo').onclick = undo;
$('restart').onclick = () => st && startLevel(level);
$('menuBtn').onclick = showMenu;
$('endLevels').onclick = showMenu;
$('endRetry').onclick = () => startLevel(level);
$('endNext').onclick = () => startLevel(Math.min(LEVELS.length - 1, level + 1));
$('mute').onclick = e => { muted = !muted; e.target.textContent = muted ? '🔇' : '🔊'; };

// Test hook (no effect on play)
window.__game = { get st() { return st; }, get state() { return state; }, get busy() { return busy(); }, get level() { return level; }, get sel() { return sel; }, get geo() { return { bx, by, cell, N }; }, tryMove, startLevel, N, LEVELS };

// ---------- balance lab hook (balance-lab skill): bots play the real rules here; nothing is drawn ----------
// One match = one attempt at a level against its timer. The timer runs while coins animate, as in the game,
// so each move costs the animation time plus the player's thinking time.
const TUNED_DEFAULT = JSON.parse(JSON.stringify(TUNED));
const labMerge = (a, b) => { for (const k in b) { if (b[k] && typeof b[k] === 'object' && a[k] && typeof a[k] === 'object') labMerge(a[k], b[k]); else a[k] = b[k]; } };
const LAB_DT = 0.1;
let LS = null;   // the lab match: { P, t, next, over, win, end, lead, hist, seen, stats, picks, total }
const labKey = s => s.plats.map(p => p.revealed ? 1 : 0).join('') + s.cells.map(c => c.join('')).join('|');
function labAnim(ev) {   // seconds the game spends animating these events (see next())
  let t = 0;

    if (e.type === 'xfer') t += .23 + (e.coins.length - 1) * (e.combo ? .028 : .038) + .04;
    else if (e.type === 'clear') t += .22 + (e.n - 1) * .055 + .6 + .08;
    else if (e.type === 'reveal') t += .42 + e.cells.length * .14 + .3;
  }
  return t;
}
function labH(s) {   // how far a board is from empty: lower is better (the same idea a person uses: fewer, taller, single-colour stacks)
  let v = s.plats.filter(p => !p.revealed).length * 30; const by = {};
  s.cells.forEach((c, i) => { if (!c.length) return; v += 2 + (c.length - run(c)) * 2; (by[top(c)] = by[top(c)] || []).push(i); });
  for (const c in by) { const L0 = by[c].reduce((m, i) => s.cells[i].length > s.cells[m].length ? i : m, by[c][0]);
    for (const i of by[c]) if (i !== L0) v += Math.abs(i % N - L0 % N) + Math.abs(((i / N) | 0) - ((L0 / N) | 0)); }
  return v + coins(s);
}
function labMoves(s) { const out = []; for (let a = 0; a < N * N; a++) if (s.cells[a].length) for (const b of nbrs(a)) if (moveCount(s, a, b)) out.push([a, b]); return out; }
function labShuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(labRand() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function labJudge(P) {   // skill: share of moves looked at, and a second move of lookahead for the best players; noise: random moves and misjudged values
  const ms = labMoves(st); if (!ms.length) return null;

  const deep = (P.skill || 0) >= .9;

    const r = move(st, m[0], m[1]); if (!r) continue;
    let v = won(r.st) ? -1e9 : labH(r.st) + (LS.seen.has(labKey(r.st)) ? 40 : 0);
    if (deep && v > -1e9) for (const m2 of labMoves(r.st)) { const r2 = move(r.st, m2[0], m2[1]); if (!r2) continue;
      const v2 = won(r2.st) ? -1e8 : labH(r2.st) + (LS.seen.has(labKey(r2.st)) ? 40 : 0) + .5; if (v2 < v) v = v2; }
    v += (labRand() - .5) * (P.noise || 0) * 12;

  }

}
function labAct() {
  const P = LS.P, m = labJudge(P), think = (P.react || 1) * (.5 + labRand());
  if (!m) {   // nothing legal: a person would undo
    LS.seen.add(labKey(st)); LS.picks.you.undo = (LS.picks.you.undo || 0) + 1;
    if (!LS.hist.length) { LS.over = true; LS.win = 0; LS.end = 'stuck'; return; }
    st = LS.hist.pop(); LS.next = LS.t + think; return;
  }
  const r = move(st, m[0], m[1]);
  LS.hist.push(st); st = r.st; LS.seen.add(labKey(st)); LS.stats.moves++;
  const hv = labH(st); if (hv < LS.bestH - .5) { LS.bestH = hv; LS.stall = 0; } else LS.stall++;
  const kind = r.ev[0].toLvl ? 'merge' : 'fold'; LS.picks.you[kind] = (LS.picks.you[kind] || 0) + 1;
  for (const e of r.ev) {
    if (e.type === 'clear') { LS.stats.clears++; if (wish && wish.c === e.color) { timeLeft += WISH_BONUS; LS.stats.wishes++; pickWish(); } else if (wish && !boardColors().includes(wish.c)) pickWish(); }
    if (e.type === 'xfer' && e.combo) LS.stats.combos++;
    if (e.type === 'reveal') LS.stats.reveals++;
  }
  const anim = labAnim(r.ev);
  if (won(st)) { LS.t += anim; LS.over = true; LS.win = 1; LS.end = 'clear'; LS.stats.timeLeft = Math.max(0, timeLeft - anim); return; }

}
function labTick() {

  if (LS.t >= LS.leadAt) { LS.lead.push([Math.round(LS.t), Math.round((1 - coins(st) / LS.total) * 1000) / 1000]); LS.leadAt += 5; }
  if (timeLeft <= 0) { LS.over = true; LS.win = 0; LS.end = 'time'; return; }
  if (LS.t >= LS.next) labAct();
}
window.LAB = {
  v: 1, game: 'dollar-stack', build: 'v4',
  sides: ['you'], levels: LEVELS.length, limit: 900, items: [],
  config: () => JSON.parse(JSON.stringify(TUNED)),
  setConfig: p => labMerge(TUNED, p),
  resetConfig: () => labMerge(TUNED, JSON.parse(JSON.stringify(TUNED_DEFAULT))),
  newMatch({ seed, level, players }) {
    LAB_RNG = seed >>> 0;
    const n = (level || 1) - 1; L = LEVELS[n]; st = parse(L); timeLeft = timeTotal = TUNED.TIME['L' + (n + 1)]; wish = null; pickWish();
    LS = { P: players.you, t: 0, next: 0, leadAt: 0, over: false, win: 0, end: '', lead: [], hist: [], seen: new Set([labKey(st)]), total: coins(st), bestH: labH(st), stall: 0,
      picks: { you: {} }, stats: { moves: 0, clears: 0, combos: 0, wishes: 0, reveals: 0, timeLeft: 0 } };
  },
  step(secs) { for (let i = Math.round(secs / LAB_DT); i > 0 && !LS.over; i--) labTick(); },
  done: () => LS.over,
  peek: () => ({ board: st.cells.map(c => c.join('') || '.'), h: labH(st), stall: LS.stall, t: LS.t, timeLeft, moves: LS.stats.moves }),   // for debugging bots
  summary: () => ({ win: LS.win, end: LS.end, t: Math.round(LS.t * 10) / 10, lead: LS.lead, picks: LS.picks, stats: { you: Object.assign({}, LS.stats, { par: L.par }) } }),
};

layout();
if (!window.LAB_MODE) {
  startLevel(Math.max(0, LEVELS.findIndex((_, k) => !save.stars[k])));
  requestAnimationFrame(frame);
}
})();
