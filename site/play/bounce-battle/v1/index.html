<!doctype html>
<html lang="en">

<title>Bounce Battle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Cinzel:wght@700;800;900&family=Signika:wght@500;600;700&display=swap">
<style>
/* Layout follows the original's screen: rival castle on top, two 4x4 boards stacked in the middle, your castle at the bottom, a road down each side. Single dark look taken from Roll to War. */
:root {
  --bg: #1c1410;
  --bg2: #2a1d14;
  --gold: #f2be4b;
  --text: #fff3d6;
  --body: "Signika", "Trebuchet MS", system-ui, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; margin: 0; background: var(--bg); overflow: hidden; overscroll-behavior: none; }
body { color: var(--text); font-family: var(--body); touch-action: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
#stage { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: radial-gradient(ellipse at center, var(--bg2) 0%, var(--bg) 70%); padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px); box-sizing: border-box; }
#bb { display: block; touch-action: none; outline: none; box-shadow: 0 0 40px rgba(0, 0, 0, .55); cursor: pointer; }
#bb:focus-visible { outline: 3px solid var(--gold); }
</style>

<div id="stage"><canvas id="bb" tabindex="0" aria-label="Bounce Battle. Each round has two turns: you attack, then you defend. Round heroes bounce round your board and fire the pieces they hit. Attack pieces work on your attack, defence pieces on your defence, and balanced pieces on both. Between rounds, drag pieces from the shop onto your board."></canvas></div>

<script>window.RTW_NO_AUTOMOUNT = true;</script>
<script src="rtw-art.js"></script>
<script src="bb-sprites.js"></script>
<script>
(() => {
'use strict';

const { text, rr, circ, ell, ink, shade } = R;
const TAU = Math.PI * 2;
const lerp = (a, b, k) => a + (b - a) * k;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const rnd = (a, b) => a + Math.random() * (b - a);
const fmt = v => (Math.abs(v - Math.round(v)) < 0.05 ? String(Math.round(v)) : v.toFixed(1));

/* ---------- layout (logical pixels) ---------- */
const LW = 400, LH = 840, TOP = 30, CH = LH + TOP, CELL = 25, N = 9, HUD = 60, TRAY = 748, WORLD_H = LH + 120;
// TOP: the canvas runs this much taller than the layout, and the field sits that much lower, so the rival tower clears the top bar
const SHOP_CAM = -256, PANEL_Y = 488, SHOP_ZOOM = 1.4;   // in the shop the field slides up and zooms in so your board fills the space above the shop panel
const SIDES = ['you', 'bot'];
const foe = o => (o === 'you' ? 'bot' : 'you');
const teamOf = o => (o === 'you' ? 'blue' : 'red');
const BOARD = { bot: { x: 88, y: 150 }, you: { x: 88, y: 426 } };   // top-left corner of each 9x9 floor
const FRAME = 23;   // the board, rail and corner posts and all, reaches about this far past the floor

const GATE_C = 4;   // new heroes drop in at the middle of the top row
const RL = {};
for (const o of SIDES) {
  const P = ROAD[o], seg = []; let L = 0;
  for (let i = 1; i < P.length; i++) { const l = Math.hypot(P[i][0] - P[i - 1][0], P[i][1] - P[i - 1][1]); seg.push(l); L += l; }
  RL[o] = { seg, L };
}
function roadAt(o, d) {
  const P = ROAD[o], { seg } = RL[o];
  d = clamp(d, 0, RL[o].L);
  for (let i = 0; i < seg.length; i++) {
    if (d <= seg[i] || i === seg.length - 1) {
      const k = Math.min(1, d / seg[i]), [x0, y0] = P[i], [x1, y1] = P[i + 1];
      return { x: lerp(x0, x1, k), y: lerp(y0, y1, k), dx: (x1 - x0) / seg[i], dy: (y1 - y0) / seg[i] };
    }
    d -= seg[i];
  }
}
const LEG = [RL.you.seg[0] + 30, RL.you.seg[0] + RL.you.seg[1] - 20];   // the long straight where barricades go

/* ---------- rules ---------- */
// A round is two turns. One side attacks (its attack pieces work) while the other defends (its defence pieces work), then they swap.

const TURN_SECS = 30, CLEAR_MAX = 7, READY_SECS = 1.8, RESULT_SECS = 3.2;
const CASTLE_HP = 100, HP_STEP = 0, HEARTS = 3, START_GEMS = 35, INCOME = { you: 10, bot: 9 }, REFRESH = 5;
const START_BALLS = 1, MAX_BALLS = 2, BALL_COST = { 2: 20 }, MAX_PIECES = 12;   // two heroes at most on a board

const RAIL_FX = 0.38;
const POP = 0.45, POP_RAIL = 0.55 + 0.45 * RAIL_FX, POP_FADE = 2.4, STICK = 0.035, STICK_RAIL = 0.035 + 0.025 * RAIL_FX;
const LOOT = [0, 1, 1.5, 2], CASTLE_LOOT = 0.35, HP_GROWTH = 0, BLOWS = 2;   // a soldier that reaches the tower strikes it twice, then it's spent

  { col: '#4f8ef0', light: '#a4c8ff', dark: '#1f4fae', mult: 1 },
  { col: '#f2be4b', light: '#ffe8a0', dark: '#b27e1f', mult: 2 },
  { col: '#3fb562', light: '#a8f0b6', dark: '#1f6e38', mult: 5 }];

  stable:   { name: 'Stable', role: 'atk', cost: 20, need: 1, reload: 0.6, auto: 15 / IDLE, va: 3.4, troop: true, desc: 'Attack: trains a fast, frail horseman every 5 s, and one more for each hero hit.' },
  archery:  { name: 'Archery Range', role: 'both', cost: 20, need: 2, needA: 2, reload: 0.8, auto: 15 / IDLE, va: 3, vd: 3.6, troop: true, desc: 'Defending: 4 arrows at the leading attackers. Attacking: an archer who shoots from range.' },
  mage:     { name: 'Mage Tower', role: 'both', cost: 18, need: 2, needA: 2, reload: 1, auto: 15 / IDLE, va: 3, vd: 3.5, troop: true, desc: 'Defending: freezes the front attackers. Attacking: a magician who shields your soldiers.' },
  ballista: { name: 'Ballista Tower', role: 'def', cost: 14, need: 2, reload: 0.9, auto: 6 / IDLE, vd: 3.2, desc: 'Defence: a bolt every 2 s through the front attacker and the one behind it. Hero hits reload it faster.' },
  cannon:   { name: 'Cannon Tower', role: 'def', cost: 14, need: 2, reload: 0.9, auto: 8 / IDLE, vd: 3.2, desc: 'Defence: a cannonball every 3 s at the toughest attacker, hurting those round it. Hits reload it.' },
  palisade: { name: 'Palisade Gate', role: 'def', cost: 14, need: 3, reload: 1, auto: 10 / IDLE, vd: 4, desc: 'Defence: drops a spiked gate on the attackers’ road about every 3 s. Hero hits speed it up.' },

};
// A War Drum beats every DRUM.beat seconds: each beat gives every building in the 3x3 around it DRUM.adv seconds of its own work at once.
// A hero that hits the drum feeds that hit to all of them (DRUM.share of it each), springs off and rushes at RUSH_SPD for DRUM.rush seconds,

const PIERCE = [1, 0.5];   // a ballista bolt's strength in the first attacker it hits and in the one behind; it stops there (it used to run through the whole column)
const DRUM = { beat: [0, 4, 3.3, 2.7], adv: [0, 2, 2.4, 2.8], share: [0, 1, 1.25, 1.5], rush: [0, 3, 3.5, 4] }, RUSH_SPD = 1.3, DRUM_POP = 0.9;
// Every building works on its own while its wave is on: its bar (need) fills every auto seconds, and each hero hit adds the hero's power to it.
// A Gold Mine digs a gem every `every` seconds instead, and each hit digs one more, up to cap a wave.
// two kinds of hero: the Ranger at normal speed with lighter hits, and the Brute, very slow but every hit counts for more.
// You choose the one you start with; the shop sells a second of either kind, two at most on a board.
// spd scales SPEED, size scales BALL_R, pow is how much one hit fills a building's bar, bars are its speed and power pips on the pick screen; art is [width, body centre] of the picture
const HEROES = {
  ranger: { name: 'Ranger', tag: 'NORMAL', spd: 1, size: 1, pow: 1, bars: [3, 2], art: [0.95, 0.6], desc: 'Normal speed, lighter hits.' },
  brute:  { name: 'Brute', tag: 'HEAVY', spd: 0.55, size: 1.15, pow: 1.65, bars: [1, 5], art: [1.2, 0.55], desc: 'Very slow, but every hit packs a punch.' },
};
const HERO_KINDS = Object.keys(HEROES);
const heroStats = kind => { const H = HEROES[kind] || HEROES.ranger; return { kind: HEROES[kind] ? kind : 'ranger', r: BALL_R * H.size, spd: H.spd, pow: H.pow }; };
// stones and trees are fixed blockers: nothing can be built there and heroes bounce off them
const BLOCKS = { stone: 'Stone', tree: 'Tree', rocks: 'Rocks', trees: 'Trees' };
// only five footprints: one square, two in a row, two in a column, three in a row, and an L. [columns, rows]
const SHAPE = {
  barracks: [2, 1], stable: [3, 1], archery: [2, 2], mage: [1, 2], ballista: [1, 2], cannon: [1, 2], palisade: [1, 2],
  goldmine: [1, 1], drum: [1, 1],
  stone: [1, 1], tree: [1, 1], rocks: [2, 1], trees: [1, 2],
};
// a footprint that isn't a plain rectangle is a list of overlapping rectangles [x, y, w, h]; SHAPE stays its bounding box
const MASK = { archery: [[0, 0, 2, 1], [0, 0, 1, 2]] };   // an L: two squares across the top and one under the left
const rectsOf = type => MASK[type] || [[0, 0, SHAPE[type][0], SHAPE[type][1]]];
const CELLS = {};   // the squares each footprint fills, [x, y] from its top-left
for (const k in SHAPE) {
  const seen = new Set(); CELLS[k] = [];
  for (const [x, y, w, h] of rectsOf(k)) for (let j = y; j < y + h; j++) for (let i = x; i < x + w; i++) if (!seen.has(i + ',' + j)) { seen.add(i + ',' + j); CELLS[k].push([i, j]); }
}
const shapeName = type => MASK[type] ? 'L' : SHAPE[type].join('×');
const SHOP_W = { barracks: 1.8, stable: 1.5, archery: 1.5, mage: 1.4, ballista: 1.6, cannon: 1.6, palisade: 1.4, goldmine: 1.6, drum: 1.3 };
const ROLE_NAME = { atk: 'Attack', def: 'Defence', both: 'Balanced', eco: 'Economy', boost: 'Boost' };
const ROLE_COL = { atk: '#d2432f', def: '#3567d6', both: '#e0a52a', eco: '#3f9a4a', boost: '#8e4fd6' };
// each match plays on one of these layouts of stones and trees, the same on both boards: [type, column, row]
const LAYOUTS = [   // two or three squares of stones and trees, the same on both boards
  [['stone', 2, 3], ['stone', 6, 5]],
  [['trees', 4, 4], ['stone', 1, 7]],
  [['rocks', 5, 2], ['tree', 2, 6]],
  [['tree', 2, 2], ['tree', 6, 2], ['stone', 4, 6]],
];
const TROOP = [null,
  { type: 'sword', hp: 5, dmg: 1, speed: 96, size: 25, name: 'Swordsman' },
  { type: 'sergeant', hp: 12, dmg: 2, speed: 84, size: 27, name: 'Sergeant' },
  { type: 'knight', hp: 26, dmg: 4, speed: 104, size: 28, name: 'Knight' }];
// the Stable's horsemen ride fast and fall fast; archers stop short of the tower and shoot it from range;
// magicians walk behind the soldiers, ward the one ahead of them, and zap the tower from close range
const HORSE = [null,
  { type: 'templar', hp: 4, dmg: 1, speed: 175, size: 25, name: 'Horseman' },
  { type: 'templar', hp: 8, dmg: 2, speed: 175, size: 26, name: 'Horseman' },
  { type: 'templar', hp: 15, dmg: 4, speed: 185, size: 27, name: 'Horseman' }];

  { type: 'longbow', hp: 6, dmg: 1, speed: 90, size: 25, range: 62, blows: 3, name: 'Archer' },
  { type: 'longbow', hp: 13, dmg: 2, speed: 90, size: 26, range: 62, blows: 3, name: 'Archer' },
  { type: 'longbow', hp: 26, dmg: 4, speed: 90, size: 27, range: 62, blows: 3, name: 'Archer' }];

  { type: 'sword', hp: 6, dmg: 1, speed: 80, size: 26, range: 34, blows: 2, ward: 2, name: 'Magician' },
  { type: 'sword', hp: 13, dmg: 2, speed: 80, size: 27, range: 34, blows: 2, ward: 4, name: 'Magician' },
  { type: 'sword', hp: 26, dmg: 4, speed: 80, size: 28, range: 34, blows: 2, ward: 8, name: 'Magician' }];

// Every building is drawn front-on from the same high angle, and each part [image, x, y, w, h, grow] is exactly as wide as

const ART = {
  barracks: [['barracks', 0, 0, 2, 1]], stable: [['stable', 0, 0, 3, 1]],
  archery: [['archtent', 0, 0, 2, 1], ['target', 0, 1, 1, 1]],
  mage: [['magetower', 0, 0, 1, 2]], ballista: [['ballista-base', 0, 0, 1, 2]], cannon: [['cannon-base', 0, 0, 1, 2]], palisade: [['palisade', 0, 0, 1, 2]],
  goldmine: [['goldmine', 0, 0, 1, 1]], drum: [['drum', 0, 0, 1, 1]],

}, RISE = 0.75;

const GUNS = {
  cannon: { sheet: 'cannon-gun', at: [0.5, 0.251], k: 0.005, kick: 0.14, rest: 2.55, views: [
    [0, 136, 139, 67.6, 137, 68.2, 29.8, 68.2, 63], [140, 176, 144, 108, 141.8, 146.5, 15.5, 24, 103], [320, 174, 106, 110.5, 104.8, 171.5, 29, 2.8, 29],
    [498, 149, 140, 76.3, 137.8, 127.8, 66.8, 22.8, 25.5], [651, 113, 140, 56.2, 138.2, 57.2, 79.2, 57.8, 25.5]] },

}
const TROOP_ART = { foot: ['sword', 'sergeant', 'knight'], horse: 'horse', archer: 'archer', mage: 'mage' };

const SPRITES = Object.values(ART).flat().map(a => a[0]).concat(['castle-blue', 'castle-red', 'flag-blue', 'flag-red'], HERO_KINDS.flatMap(k => ['hero-' + k + '-blue', 'hero-' + k + '-red']),

// each hero's pose sheet, drawn in Ludo: a crouch, a leap, a tucked roll and a spread for its jumps, the leap seen from 8 sides (spin0-7)
