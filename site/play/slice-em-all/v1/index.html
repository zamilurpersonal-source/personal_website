<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Slice Em All</title>
<style>
/* Lilita One and Nunito (latin), vendored from Google Fonts so the game loads only from its own folder */
@font-face {
  font-family: 'Lilita One';
  font-style: normal;
  font-weight: 400;
  font-display: swap;
  src: url(fonts/lilita-one-latin-400.woff2) format('woff2');
  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
}
@font-face {
  font-family: 'Nunito';
  font-style: normal;
  font-weight: 700;
  font-display: swap;
  src: url(fonts/nunito-latin.woff2) format('woff2');
  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
}
@font-face {
  font-family: 'Nunito';
  font-style: normal;
  font-weight: 900;
  font-display: swap;
  src: url(fonts/nunito-latin.woff2) format('woff2');
  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
}
</style>
<style>
/* Layout: one phone-shaped column. HUD plaque on top, board canvas fills the middle, booster tray at the bottom. Deep arcade blue, gold-rimmed Ludo.AI art. */
:root{
  --sea:#1747c9; --sea-deep:#0a237a; --plaque:#2a6be8; --plaque-edge:#123a9a;
  --cream:#fff6dc; --cream-edge:#e7cf97; --ink:#3a1e0c; --gold:#f6c93a;
  --leaf:#3fcf34; --leaf-dark:#1f8a1b; --badge:#e5262f; --white:#ffffff;
  --display:"Lilita One","Arial Rounded MT Bold","Trebuchet MS",sans-serif;
  --body:"Nunito","Trebuchet MS",system-ui,sans-serif;
  --pop:cubic-bezier(.34,1.56,.64,1);
  --cream-face:#f8eddd; /* backs the cream 9-slice panels so a sub-pixel gap between slices shows cream, not a dark seam */
  color-scheme:dark;
}
html,body{height:100%;margin:0;overflow:hidden}
[hidden]{display:none!important}
body{margin:0;background:radial-gradient(120% 80% at 50% 45%,var(--sea) 0%,var(--sea-deep) 85%) var(--sea-deep);color:var(--white);font-family:var(--body);overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
body.has-bg{background:url(assets/bg.webp) center/cover no-repeat fixed,var(--sea-deep)}
/* ambient: a slow light "breath" behind everything */
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(60% 45% at 50% 46%,#c4e2ff,transparent 72%);opacity:.05;animation:breath 8s ease-in-out infinite}
@keyframes breath{50%{opacity:.17}}
#app{height:100%;max-width:520px;margin:0 auto;display:flex;flex-direction:column;padding-inline:16px;box-sizing:border-box}
.topbar{display:flex;justify-content:space-between;padding-block:10px 0}
button{font:inherit;color:inherit}
.round{width:46px;height:46px;border:0;background:none;padding:0;cursor:pointer;position:relative;transition:transform .18s var(--pop)}
.round img{position:absolute;inset:0;width:100%;height:100%;filter:drop-shadow(0 3px 0 #08205f)}
.round svg{width:22px;height:22px}
.round img+svg{display:none}
.round:active{transform:scale(.92) translateY(2px);transition-duration:.06s}
.round:focus-visible,.boost:focus-visible,.btn:focus-visible,.sw:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
/* HUD plaque (hud.webp, stretched with border-image so the gold rim keeps its corners) */
.hud{position:relative;margin-top:6px;border:22px solid transparent;border-image:url(assets/hud.webp) 50 fill / 22px stretch;box-shadow:0 8px 10px -4px #04123d99;display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:end;padding:2px 0 0}
.goal-tag{position:absolute;top:-34px;left:50%;transform:translateX(-50%);background:linear-gradient(#3d8bff,#1f5fe0);border:3px solid var(--plaque-edge);border-radius:10px;font-family:var(--display);font-size:16px;letter-spacing:.06em;padding:1px 18px;text-shadow:0 2px 0 #0b2c80}
.stat{display:flex;flex-direction:column;align-items:center;gap:2px}
.stat small{font-family:var(--display);font-size:11px;letter-spacing:.08em;background:#1f5fe0;border:2px solid var(--plaque-edge);border-radius:6px;padding:0 8px}
.num{font-family:var(--display);font-size:26px;line-height:1;color:var(--ink);border:10px solid transparent;border-image:url(assets/cream.webp) 50 fill / 12px stretch;background:linear-gradient(var(--cream-face),var(--cream-face)) center/calc(100% - 6px) calc(100% - 6px) no-repeat border-box;border-radius:12px;min-width:30px;padding:0 2px;text-align:center;font-variant-numeric:tabular-nums}
/* the digit punches and beats on its own span: scaling a border-image box shows seams between its 9 slices */
.num span{display:inline-block}
.num.low{color:#d4141e;filter:drop-shadow(0 0 6px #ff3030aa)}
.num.low span{animation:beat 1.2s ease-in-out infinite}
.num.crit span{animation-duration:.7s}
@keyframes beat{0%,50%,100%{transform:scale(1)}12%{transform:scale(1.15)}25%{transform:scale(1)}37%{transform:scale(1.1)}}
.goals{border:12px solid transparent;border-image:url(assets/cream.webp) 50 fill / 14px stretch;background:linear-gradient(var(--cream-face),var(--cream-face)) center/calc(100% - 6px) calc(100% - 6px) no-repeat border-box;border-radius:12px;display:flex;justify-content:center;gap:22px;padding:0 4px;min-height:24px;align-items:center}
.goal{position:relative;width:40px;height:40px;transition:opacity .25s}
.goal.await{opacity:0}
.goal canvas{width:40px;height:40px;display:block}
.goal b{position:absolute;right:-8px;bottom:-4px;font-family:var(--display);font-weight:400;font-size:18px;color:var(--white);-webkit-text-stroke:4px #6b3b12;paint-order:stroke fill}
.goal .chk{position:absolute;right:-12px;bottom:-8px;width:28px;height:23px;object-fit:contain;display:none;filter:drop-shadow(0 2px 0 #0b4d0a);color:#3fcf34;font:900 20px var(--body)}
.goal.done .chk{display:block}
/* booster-arming banner that slides down over the HUD */
.hud>*{transition:opacity .2s}
body.arming .hud>:not(.bbanner){opacity:0}
.bbanner{position:absolute;left:-14px;right:-14px;top:-18px;z-index:4;display:flex;align-items:center;gap:8px;padding:0 6px;transform:translateY(-140%);opacity:0;pointer-events:none;transition:transform .2s ease-in,opacity .2s}
.bbanner.show{transform:none;opacity:1;transition:transform .3s var(--pop),opacity .12s}
.bbanner img{width:92px;height:92px;object-fit:contain;filter:drop-shadow(0 4px 4px #000a);flex:none}
.bbanner strong{display:block;font-family:var(--display);font-weight:400;font-size:32px;line-height:1.05;color:#ffd84a;-webkit-text-stroke:6px #3a1a00;paint-order:stroke fill;text-shadow:0 3px 0 #2a1200}
.bbanner span{display:block;font-weight:900;font-size:15px;line-height:1.25;text-shadow:0 2px 0 #000c;text-wrap:balance}
#stage{flex:1;position:relative;min-height:0;z-index:4}
#board{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:grab}
#dim{position:fixed;inset:0;z-index:3;background:rgba(2,6,20,.72);opacity:0;pointer-events:none;transition:opacity .2s}
body.arming #dim{opacity:1;pointer-events:auto}
.tray{position:relative;display:flex;justify-content:center;gap:22px;padding-block:6px 18px}
.boost{position:relative;width:62px;height:62px;border:0;border-radius:16px;background:url(assets/slot.webp) center/100% 100% no-repeat;box-shadow:0 6px 6px -2px #04123d99;cursor:pointer;display:grid;place-items:center;padding:0;transition:transform .18s var(--pop),box-shadow .12s,opacity .2s,filter .2s}
.boost canvas{width:46px;height:46px}
.boost:active{transform:scale(.92) translateY(2px);box-shadow:0 2px 3px -1px #04123d99;transition-duration:.06s}
.boost .badge{position:absolute;right:-8px;bottom:-8px;min-width:22px;height:22px;border-radius:11px;background:var(--badge);border:2px solid var(--white);font-family:var(--display);font-size:14px;line-height:20px;color:var(--white);box-sizing:border-box;text-align:center}
.boost.armed{z-index:4;transform:translateY(-6px) scale(1.06);box-shadow:0 0 22px 6px #fff8;animation:armIn .18s var(--pop) both,armBob .83s ease-in-out .18s infinite}
@keyframes armIn{from{transform:none}to{transform:translateY(-6px) scale(1.06)}}
@keyframes armBob{0%,100%{transform:translateY(-6px) scale(1.06);box-shadow:0 0 16px 4px #fff6}50%{transform:translateY(-10px) scale(1.06);box-shadow:0 0 30px 10px #fffb}}
.boost.off{opacity:.35;filter:saturate(0)}
.boost.empty{filter:saturate(.35) brightness(.8)}
.boost.empty .badge{background:#3fcf34;font-size:17px;line-height:18px}
.lvls{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.pill{border:0;border-radius:10px;background:linear-gradient(#3d8bff,#1f5fe0);box-shadow:0 3px 0 #0b2c80;font-family:var(--display);font-size:15px;padding:5px 10px;cursor:pointer;color:#fff;display:flex;align-items:center;gap:4px}
.pill img{width:22px;height:22px;object-fit:contain}
.pill:active{transform:translateY(2px);box-shadow:0 1px 0 #0b2c80}
.tempo .pill{padding:5px 8px}
.pill.on{background:linear-gradient(#ffd84a,#e8a400);color:#3a1a00}
.row.sub{font-size:15px;padding-block:6px}
.toast img{height:1.15em;vertical-align:-.22em}
.tip{position:absolute;bottom:calc(100% + 12px);right:-18px;width:150px;background:#fff;color:#123a9a;border-radius:12px;padding:7px 10px;font-weight:900;font-size:13px;line-height:1.25;box-shadow:0 4px 0 #0b2c80;pointer-events:none;transform-origin:85% 110%}
.tip::after{content:"";position:absolute;right:38px;top:100%;border:8px solid transparent;border-top-color:#fff}
#tipB{right:auto;left:50%;margin-left:-75px;transform-origin:50% 110%}
#tipB::after{right:auto;left:67px}
/* a tip sits above the board layer while it shows, and the swipe hint steps aside for it and for an armed booster */
.tray.tipup{z-index:6}
body.arming #hint,body.tipping #hint,body.toasting #hint{visibility:hidden}
/* booster nudge: the slot bounces and glows when the board has run dry */
.boost.nudge{animation:nudge 1.1s ease-in-out infinite}
@keyframes nudge{0%,100%{transform:none;box-shadow:0 6px 6px -2px #04123d99}30%{transform:translateY(-8px) scale(1.08);box-shadow:0 0 22px 8px #ffe066cc}55%{transform:translateY(0) scale(.98)}}
.toast{position:absolute;left:50%;top:8px;transform:translate(-50%,-12px);opacity:0;background:#081a55e6;border:2px solid var(--gold);border-radius:12px;padding:8px 14px;text-align:center;font-weight:900;font-size:14px;max-width:90%;pointer-events:none;transition:opacity .15s,transform .15s}
.toast.show{opacity:1;transform:translate(-50%,0);transition:opacity .22s,transform .22s var(--pop)}
.toast strong{display:block;font-family:var(--display);font-weight:400;font-size:24px;color:var(--gold);letter-spacing:.02em}
.hint{position:absolute;left:0;right:0;bottom:4px;text-align:center;font-family:var(--display);font-size:18px;text-shadow:0 2px 0 #08205f;pointer-events:none;animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-5px)}}
/* red ribbon callouts over the board ("Level Complete!", "5 Moves Left!") */
.ribbon{position:absolute;left:0;right:0;margin-inline:auto;top:36%;width:min(94%,430px);aspect-ratio:600/236;background:url(assets/banner.webp) center/100% 100% no-repeat;display:grid;place-items:center;padding-bottom:7.6%;box-sizing:border-box;pointer-events:none;opacity:0;z-index:2}
.ribbon span,.ribbonH span{font-family:var(--display);font-weight:400;color:#fff;-webkit-text-stroke:6px #6a0a10;paint-order:stroke fill;text-shadow:0 3px 0 #4a0508;white-space:nowrap}
.ribbon span{font-size:clamp(24px,8.4vw,36px)}
/* level-start goal card */
.gcard{position:absolute;left:0;right:0;top:50%;transform:translateY(-58%);margin-inline:auto;width:min(268px,82%);z-index:2;pointer-events:none}
.gcard .in{border:28px solid transparent;border-image:url(assets/ui_panel.webp) 60 fill / 28px stretch;padding:0 0 2px;text-align:center;opacity:0}
.gc-title{font-family:var(--display);font-size:32px;color:#ffd84a;-webkit-text-stroke:5px #3a1a00;paint-order:stroke fill;line-height:1;margin-top:-6px}
.gc-sub{font-family:var(--display);font-size:15px;letter-spacing:.08em;margin:4px 0 6px;text-shadow:0 2px 0 #0b2c80}
.gc-goals{display:flex;justify-content:center;gap:16px;border:12px solid transparent;border-image:url(assets/cream.webp) 50 fill / 14px stretch;background:linear-gradient(var(--cream-face),var(--cream-face)) center/calc(100% - 6px) calc(100% - 6px) no-repeat border-box;border-radius:12px;padding:0 4px}
.gc-g{position:relative;width:58px;height:58px}
.gc-g img{width:100%;height:100%;object-fit:contain}
.gc-g b{position:absolute;right:-12px;bottom:-6px;font-family:var(--display);font-weight:400;font-size:22px;-webkit-text-stroke:5px #6b3b12;paint-order:stroke fill}
.gc-moves{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:8px;font-family:var(--display);font-size:20px;text-shadow:0 2px 0 #0b2c80}
.mbadge{width:50px;height:50px;display:grid;place-items:center;background:url(assets/moves_badge.webp) center/contain no-repeat;font-family:var(--display);font-size:21px;-webkit-text-stroke:4px #0b2c80;paint-order:stroke fill}
/* modals */
.modal{position:fixed;inset:0;display:grid;place-items:center;padding:16px;z-index:5}
.modal::before{content:"";position:absolute;inset:0;background:rgba(3,11,44,.75);opacity:0;transition:opacity .2s}
.modal.fail::before{background:radial-gradient(90% 70% at 50% 42%,#5c2a8cf0,#14062bfa)}
.modal.show::before{opacity:1}
.card{position:relative;border:28px solid transparent;border-image:url(assets/ui_panel.webp) 60 fill / 28px stretch;padding:0 4px 6px;width:min(320px,100%);text-align:center;box-sizing:border-box}
.card.bare{border:0;border-image:none;width:min(360px,100%);padding:0}
.card.pop{animation:pop .36s var(--pop) both}
@keyframes pop{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.06);opacity:1}100%{transform:scale(1);opacity:1}}
.card p{margin:0 0 14px;font-size:15px;line-height:1.4;font-weight:700}
.ribbonH{position:relative;width:calc(100% + 64px);margin:-50px -32px 0;aspect-ratio:600/236;background:url(assets/banner.webp) center/100% 100% no-repeat;display:grid;place-items:center;padding-bottom:8%;box-sizing:border-box}
.ribbonH span{font-size:27px}
.bare .ribbonH{width:100%;margin:0}
.bare .ribbonH span{font-size:clamp(26px,8.6vw,36px)}
.stars{display:flex;justify-content:center;align-items:flex-end;gap:2px;height:78px;margin:-4px 0 8px}
.stars{position:relative}
.stars.win::before{content:"";position:absolute;left:50%;top:50%;width:300px;height:300px;margin:-150px 0 0 -150px;background:url(assets/fx_rays.webp) center/contain no-repeat;opacity:.55;mix-blend-mode:screen;animation:spin 14s linear infinite,fadeIn .6s .3s both;pointer-events:none}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fadeIn{from{opacity:0}}
.stars .slot{position:relative;width:62px;height:59px}
.stars .slot.s1{width:80px;height:76px;margin-bottom:10px}
.stars .slot::before{content:"";position:absolute;inset:0;background:url(assets/star.webp) center/contain no-repeat;filter:brightness(.28) saturate(0);opacity:.8}
.stars .slot img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;animation:starIn .42s var(--pop) both}
.stars.lost .slot::before{filter:brightness(.2) saturate(0);opacity:.85}
@keyframes starIn{0%{transform:scale(2) rotate(-30deg);opacity:0}100%{transform:none;opacity:1}}
.btns{display:flex;flex-direction:column;gap:10px;align-items:center}
/* buttons are one pre-sliced bitmap each (btn_*_wide = the 9-slice baked at 190x56), so their breathe/press scale never shows slice seams */
.btn{position:relative;min-width:190px;min-height:56px;font-family:var(--display);font-weight:400;font-size:23px;color:#fff;border:0;background:url(assets/btn_green_wide.webp) center/100% 100% no-repeat;padding:2px 30px 7px;cursor:pointer;text-shadow:0 2px 0 #1a6a10,0 0 3px #1a6a10;transition:transform .18s var(--pop),filter .12s}
.btn:active{transform:scale(.92) translateY(2px);transition-duration:.06s;filter:brightness(.94)}
.btn.alt{background-image:url(assets/btn_orange_wide.webp);text-shadow:0 2px 0 #9a4a00,0 0 3px #9a4a00}
.btn.cyan{background-image:url(assets/btn_blue_wide.webp);text-shadow:0 2px 0 #0b4a8a,0 0 3px #0b4a8a}
.btn.popin{animation:popIn .22s var(--pop) both,breathe 1.8s ease-in-out infinite}
.btn.pulse{animation:popIn .22s var(--pop) both,breathe 1s ease-in-out infinite}
@keyframes popIn{from{transform:scale(0)}to{transform:scale(1)}}
@keyframes breathe{50%{transform:scale(1.03)}}
.sad{display:block;width:150px;height:166px;object-fit:contain;margin:6px auto 4px;filter:drop-shadow(0 6px 8px #0007);animation:sob 1.6s ease-in-out .5s infinite;transform-origin:50% 100%}
@keyframes sob{0%,100%{transform:none}12%{transform:scale(1.03,.96)}24%{transform:none}36%{transform:scale(1.02,.97)}48%{transform:none}}
.card .oom{font-family:var(--display);font-size:26px;margin:0 0 6px;text-shadow:0 3px 0 #2a0a40}
.left{display:flex;justify-content:center;gap:22px;margin:0 0 14px}
.left div{position:relative;width:48px;height:48px}
.left img{width:100%;height:100%;object-fit:contain}
.left b{position:absolute;right:-10px;bottom:-6px;font-family:var(--display);font-weight:400;font-size:20px;-webkit-text-stroke:4px #6b3b12;paint-order:stroke fill}
.row{display:flex;justify-content:space-between;align-items:center;padding:8px 6px;font-weight:900;font-size:18px}
.sw{width:60px;height:34px;border-radius:17px;background:#6c7489;border:3px solid #13245e;position:relative;cursor:pointer;padding:0;transition:background .16s;box-shadow:inset 0 3px 0 #0003}
.sw .knob{position:absolute;top:2px;left:2px;width:24px;height:24px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#d9e2f5);box-shadow:0 2px 0 #0004;transition:transform .16s var(--pop)}
.sw[aria-checked=true]{background:#3fcf34}
.sw[aria-checked=true] .knob{transform:translateX(26px)}
.help{font-size:13px!important;font-weight:700;opacity:.92;margin:8px 0 12px!important}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:8}
/* new-mechanic card: the item floats over slowly turning golden rays */
.newart{position:relative;width:200px;height:158px;margin:-6px auto 6px;display:grid;place-items:center}
.newart .rays{position:absolute;left:50%;top:50%;width:270px;height:270px;margin:-135px 0 0 -135px;opacity:.95;animation:spin 21s linear infinite;pointer-events:none}
.newart canvas{position:relative;width:124px;height:124px;animation:float 2.2s ease-in-out infinite;filter:drop-shadow(0 8px 6px #0007)}
@keyframes float{50%{transform:translateY(-7px) rotate(-3deg)}}
.card .nt{font-size:16px;line-height:1.35;margin:0 4px 16px}
.card .nt b{color:#ffd84a}
/* tutorial: the booster tray dims and sleeps while a move is being taught */
body.tut .tray{filter:brightness(.4) saturate(.5);pointer-events:none}
body.tut #dim{opacity:1;background:rgba(4,10,40,.62)}
.tray{transition:filter .3s}
.toast.low{top:auto;bottom:6px;transform:translate(-50%,14px);font-size:15px;line-height:1.25;padding:9px 18px;background:linear-gradient(#2a6be8,#123a9a);border:3px solid var(--gold);border-radius:16px;box-shadow:0 5px 0 #08205f,0 0 18px #0008;text-shadow:0 2px 0 #08205f;width:max-content;max-width:88%}
.toast.low.show{transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){.hint,.num.low span,.num.crit span,body::before,.boost.armed,.boost.nudge,.sad,.btn.popin,.btn.pulse,.stars.win::before,.newart .rays,.newart canvas{animation:none}.boost.armed{transform:translateY(-6px) scale(1.06)}.boost.nudge{box-shadow:0 0 22px 8px #ffe066cc}}
</style>

<div id="app">

const POP="cubic-bezier(.34,1.56,.64,1)";

// ---------- levels: a three-level prototype of the board power-ups (1 Shuriken Clone, 2 Twin Bomb, 3 Diagonal Bomb) ----------

const LEVELS=[
 {n:1,map:[

 {n:2,map:[
  "PPPPPPPPP",
  "PPPPPPPPP",
  "PPP#P#PPP",
  "PPPPPPPPP",
  "PPPPPPPPP",
  "RPPPPPPPR",
  "RRPPPPPRR",
  "CRPP#PPRC",
  "CCRPPPRCC",
  "CCCRRRCCC"],

  "dopodpdop",
  "pdoc-opdo",
  "opd.o.dpo",
  "o.ppppdod",
  "dodkopodo",
  ".po|dopd.",
  "..dpodp..",
  "..od.po..",
  "...pdo...",
  "........."],
  sh:{x:1,y:3},moves:22,boosts:{hammer:1,arrow:1,rocket:1},intro:"twin"},
 {n:3,map:[
  "PPPPPPPPP",
  "PPPPPPPPP",
  "PRPPPPPRP",
  "P#RPPPR#P",
  "PP#RPR#PP",
  "PPP#P#PPP",
  "PPPPPPPPP",
  "CPPPPPPPC",
  "CCPPPPPCC",
  "CCCPPPCCC"],

  ".pppppodo",

const PCH={p:"pepper",o:"orange",d:"dragon",c:"corn",k:"daikon","1":"clone","2":"twin","3":"diag"};
for(const L of LEVELS)if(!L.initial){L.initial=[];L.pieces.forEach((row,y)=>[...row].forEach((ch,x)=>{if(PCH[ch])L.initial.push([PCH[ch],x,y]);}));}
let LV=0,MAP,INITIAL,START_SH,START_MOVES;
const COLS=9, ROWS=10;
const SIZE={pepper:[1,1],orange:[1,1],dragon:[1,1],corn:[2,1],daikon:[1,2],bomb:[1,1],tnt:[1,1],keg:[1,1],clone:[1,1],twin:[1,1],diag:[1,1]};
const BLAST={bomb:1,tnt:2,keg:1}; // explosion radius: bomb and powder keg 3x3, TNT 5x5
const isExplosive=t=>t in BLAST;
// board power-ups: a run of 3 same fruit in one throw leaves a Clone, 4 a Twin Bomb, 5+ a Diagonal Bomb
const POWER={clone:"Shuriken Clone",twin:"Twin Bomb",diag:"Diagonal Bomb"};
const PCOL={clone:"#6fe3ff",twin:"#ff9a2a",diag:"#ff5ad8"}; // each power-up's halo

const BIG_KILL=99; // big-kill Diagonal Bombs are off: on a 9-wide board almost every full-row throw kills 8
const earnType=n=>n>=5?"diag":n===4?"twin":"clone";
const DIAG4=[[1,1],[1,-1],[-1,1],[-1,-1]];
const JUICE={pepper:["#8fdc3a","#d4f58a","#f4ffe0"],orange:["#ff9a1f","#ffc65a","#fff1c2"],dragon:["#8a3fd1","#c58cff","#efd9ff"],corn:["#ffe14a","#fff3a8","#ffffff"],daikon:["#ffc82e","#ffe98a","#fffbe0"],bomb:["#ffd23a","#ff7a1a","#ffffff"],tnt:["#ffd23a","#ff3a1a","#ffffff"],keg:["#ffd23a","#ff7a1a","#ffffff"],clone:["#8ff0ff","#ffffff","#3fb8ff"],twin:["#ffd23a","#ff5a3a","#ffffff"],diag:["#ffd23a","#e01ad8","#ffffff"]};
const SPLAT={pepper:"fx_juice_green",orange:"fx_juice_orange",dragon:"fx_juice_purple",corn:"fx_juice_yellow",daikon:"fx_juice_yellow"}; // grape splat is the white splat tinted purple
const FLESH={pepper:["#f2ffd9","#a6e872","#f5f0c8"],orange:["#ffe08a","#ff9a1f","#fff3c4"],dragon:["#ffffff","#f6eef2","#1a1a1a"],corn:["#fff8b8","#ffd52e","#e8b800"],daikon:["#ffffff","#efe9d8","#d9d2bb"]};
// Refill rule switch (audit item 17): when true, 1x1 pieces also slide diagonally while columns are still falling,
// which fills holes under stuck corn/daikon. Off until the user confirms the rule change.
const DIAG_FILL=false;
const N4=[[1,0],[-1,0],[0,1],[0,-1]];

const playable=(x,y)=>x>=0&&y>=0&&x<COLS&&y<ROWS&&MAP[y][x]!=="."&&MAP[y][x]!=="#";
const topRow=[], cornSafe=[];
const MAG={">":[1,0],"<":[-1,0],"v":[0,1],"^":[0,-1]};
const SIM=/sim/.test(location.hash); // balancing bots drive update() themselves: no render loop, no cards
function setLevel(i){LV=(i%LEVELS.length+LEVELS.length)%LEVELS.length;const L=LEVELS[LV];MAP=L.map;INITIAL=L.initial;START_SH=L.sh;START_MOVES=L.moves;
  for(let x=0;x<COLS;x++){let y=0;while(y<ROWS&&!playable(x,y))y++;topRow[x]=y;}
  // a corn may only spawn into a column pair with the same wall profile: otherwise it ends up parked on a wall slit
  // in one column and starves the other column below it (permanent holes until the corn is sliced)
  for(let x=0;x<COLS-1;x++){let ok=topRow[x]===topRow[x+1];for(let y=topRow[x];ok&&y<ROWS;y++)ok=playable(x,y)===playable(x+1,y);cornSafe[x]=ok;}
  cornSafe[COLS-1]=false;
  if(W)resize();}

// ---------- small helpers ----------
const clamp01=v=>v<0?0:v>1?1:v, lerp=(a,b,t)=>a+(b-a)*t, rnd=(a,b)=>a+Math.random()*(b-a), rint=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const eOutQuad=t=>1-(1-t)*(1-t), eInCubic=t=>t*t*t, eOutCubic=t=>1-(1-t)*(1-t)*(1-t), eInOut=t=>t<.5?2*t*t:1-(-2*t+2)*(-2*t+2)/2;
const eOutBack=(t,s=1.70158)=>{const u=t-1;return 1+(s+1)*u*u*u+s*u*u;};
const eOutElastic=t=>t<=0?0:t>=1?1:Math.pow(2,-10*t)*Math.sin((t*10-.75)*2.0944)+1;
function prune(a,keep){let j=0;for(let i=0;i<a.length;i++){const o=a[i];if(keep(o))a[j++]=o;}a.length=j;}
function anim(el,frames,dur,easing=POP){if(!el||!el.animate)return null;try{return el.animate(frames,{duration:dur*UI_SLOW,easing});}catch(e){return null;}}
function punch(el,from=1.3,dur=220){return anim(el,[{transform:`scale(${from})`},{transform:"scale(1)"}],dur);}
const CAP={fx:400,halves:60,puffs:80,splats:40};

// ---------- game state ----------
let S, uid=1, gid=0;
function newGame(){
  gid++;
  S={gid,occ:[...Array(ROWS)].map(()=>Array(COLS).fill(null)),
     stat:[...Array(ROWS)].map((_,y)=>[...Array(COLS)].map((_,x)=>MAP[y][x]==="R"?"rock":MAP[y][x]==="C"?"crate":MAG[MAP[y][x]]?"mag":null)),
     pieces:new Map(),
     sh:{x:START_SH.x,y:START_SH.y,px:START_SH.x,py:START_SH.y,rot:0,spin:.6,shake:0,shakeDir:[1,0],charging:false,charge:0,embed:-1,edx:0,edy:0},
     moves:START_MOVES,crates:0,rocks:0,shown:{crate:0,rock:0},busy:true,anim:null,settle:0,mode:null,
     boosts:{...LEVELS[LV].boosts},booms:[],pending:[],thrown:false,over:false,ending:false,extraUsed:false,paused:false,
     fx:[],halves:[],texts:[],bubbles:[],glows:[],shock:[],puffs:[],splats:[],slash:[],stars:[],fire:[],converge:[],rings:[],breaks:[],
     hitstop:0,slowT:0,trauma:0,shk:[0,0,0],shkNext:0,kick:null,bflash:null,block:null,trailFade:null,
     pitch:0,chain:0,flyers:0,awaitFly:false,queued:null,idle:0,hint:null,aim:null,intro:{t:0,card:false,fly:false},bonus:null,
     statDirty:true,clearSum:0,clearN:0,shine:null,nextShine:3,warned5:false,time:0,lastLand:-1,spawnStack:null,
     mags:[],zaps:[],tut:null,tutNext:null,cue:null,goals:[],powers:[],blades:[],homers:[],rockets:[],merges:[],tipNext:null};
  for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++){if(S.stat[y][x]==="rock")S.rocks++;if(S.stat[y][x]==="crate")S.crates++;}
  S.shown.crate=S.crates;S.shown.rock=S.rocks;
  S.goals=Object.keys(GOALS).filter(k=>goalLeft(k)>0);
  for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++){const c=MAP[y][x];
    if(MAG[c])S.mags.push({x,y,fx:MAG[c][0],fy:MAG[c][1],cling:9,glow:0,ph:x*1.7+y*.9});
    if(c==="K"){const p=addPiece("keg",x,y,y-ROWS-2);p.delay=RAIN0*TEMPO+x*.035+(ROWS-y-1)*.02;}} // kegs come only from the map, never from refill
  // level intro: the goal card shows over the bare board, then the pieces rain in column by column, bottom first
  for(const [t,x,y] of INITIAL){const p=addPiece(t,x,y,y-ROWS-2);p.delay=RAIN0*TEMPO+x*.035+(ROWS-y-SIZE[t][1])*.02;}
  FX.fly.length=0;FX.conf.length=0;FX.spk.length=0;FX.rings.length=0;
  ($("lvl").firstElementChild||$("lvl")).textContent=LEVELS[LV].n;buildGoals();document.body.classList.remove("tut");hideToast();
  closeModal();boostUI(null);nudge(null);resetRibbon();hideGoalCard(true);
  for(const g of document.querySelectorAll(".goal"))g.classList.add("await");
  $("hint").hidden=true;hud(true);staticForce=true;
}
function cells(p,dx=0,dy=0){const r=[];for(let j=0;j<p.h;j++)for(let i=0;i<p.w;i++)r.push([p.x+i+dx,p.y+j+dy]);return r;}
function addPiece(type,x,y,vy=y){const [w,h]=SIZE[type];
  const p={id:uid++,type,x,y,w,h,vx:x,vy:y,path:null,seg:0,dist:0,vel:0,delay:0,landT:1,pop:1,shove:null,fresh:false};
  S.pieces.set(p.id,p);for(const [cx,cy] of cells(p))S.occ[cy][cx]=p.id;
  if(vy!==y){p.vy=vy;p.path=[[x,vy],[x,y]];}
  return p;}
function removePiece(p){for(const [cx,cy] of cells(p))if(S.occ[cy]?.[cx]===p.id)S.occ[cy][cx]=null;S.pieces.delete(p.id);}
const isSh=(x,y)=>S.sh.x===x&&S.sh.y===y;
const isFree=(x,y)=>playable(x,y)&&!S.stat[y][x]&&S.occ[y][x]==null&&!isSh(x,y);
function canMove(p,dx,dy){return cells(p,dx,dy).every(([x,y])=>playable(x,y)&&!S.stat[y][x]&&!isSh(x,y)&&(S.occ[y][x]==null||S.occ[y][x]===p.id));}
// logical move; the visual follows the recorded waypoints (see updatePieces)
function movePiece(p,dx,dy){for(const [x,y] of cells(p))S.occ[y][x]=null;p.x+=dx;p.y+=dy;for(const [x,y] of cells(p))S.occ[y][x]=p.id;
  if(!p.path){p.path=[[p.vx,p.vy]];p.seg=0;p.dist=0;p.vel=0;p.fresh=true;}p.path.push([p.x,p.y]);}

// ---------- throwing ----------
const DIRS={up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]};
const dirOf=(dx,dy)=>Math.abs(dx)>Math.abs(dy)?(dx>0?"right":"left"):(dy>0?"down":"up");
// cells that stop the blade and a rolling keg: board edge, wall slit, rock, magnet
const solid=(x,y)=>!playable(x,y)||S.stat[y][x]==="rock"||S.stat[y][x]==="mag";
const pieceAt=(x,y)=>{const id=S.occ[y]?.[x];return id==null?null:S.pieces.get(id)||null;};
// a magnet's beam: the cells in front of its open end, up to the first rock, wall slit, board edge or other magnet
function lane(m){const r=[];let x=m.x+m.fx,y=m.y+m.fy;while(!solid(x,y)){r.push([x,y]);x+=m.fx;y+=m.fy;}return r;}
// the magnet that grabs a blade entering (x,y) ACROSS its beam (the nearer magnet wins where beams overlap)
function magnetAt(x,y,dx,dy,used){let best=null,bd=1e9;
  for(const m of S.mags){if(used.has(m)||dx*m.fx+dy*m.fy!==0)continue;const d=Math.abs(x-m.x)+Math.abs(y-m.y);
    if(d<bd&&lane(m).some(([a,b])=>a===x&&b===y)){bd=d;best=m;}}
  return best;}
// the whole throw, planned before it flies. steps: cells entered {x,y,dx,dy,bend?}; bend = the magnet that turns the blade
// toward itself there (each magnet pulls once per throw). kick: the keg the blade bumps into. cling: the magnet it lands against.
function planThrow(dx,dy){const steps=[],used=new Set(),bends=[];let x=S.sh.x,y=S.sh.y,kick=null,g=0;
  while(g++<40){const nx=x+dx,ny=y+dy;if(solid(nx,ny))break;
    const p=pieceAt(nx,ny);if(p&&p.type==="keg"){kick=planRoll(p,dx,dy);break;}
    x=nx;y=ny;const s={x,y,dx,dy};steps.push(s);
    const m=magnetAt(x,y,dx,dy,used);if(m){used.add(m);s.bend=m;bends.push(steps.length-1);dx=-m.fx;dy=-m.fy;}}
  const cling=kick?null:S.mags.find(m=>m.x===x+dx&&m.y===y+dy&&m.x+m.fx===x&&m.y+m.fy===y)||null;
  return {steps,kick,cling,bends,edx:dx,edy:dy};}
// a kicked keg goes exactly where the blade would have gone: it smashes fruit and crates and stops in front of the
// first rock, wall, magnet or explosive, where it blows up (3x3)
function planRoll(p,dx,dy){const cells=[];let x=p.x,y=p.y;
  while(!solid(x+dx,y+dy)){const q=pieceAt(x+dx,y+dy);if(q&&isSpecial(q.type))break;x+=dx;y+=dy;cells.push([x,y]);}
  return {id:p.id,ox:p.x,oy:p.y,dx,dy,cells,ex:x,ey:y,t:0,idx:0};}
function pathFor(dir){const [dx,dy]=DIRS[dir];return planThrow(dx,dy).steps.map(s=>[s.x,s.y]);}
// blade position after travelling t cells along the planned steps
function posAt(A,t){const st=A.steps,n=st.length;if(!n)return [A.fromX,A.fromY];t=Math.max(0,Math.min(t,n));
  const i=Math.min(Math.floor(t),n-1),s=st[i];if(t>=n)return [s.x,s.y];const f=t-i,pv=i?st[i-1]:{x:A.fromX,y:A.fromY};
  return [pv.x+(s.x-pv.x)*f,pv.y+(s.y-pv.y)*f];}
function throwSh(dir){
  if(!S||!DIRS[dir])return;
  if(S.intro)skipIntro();
  if(S.over||S.mode||S.paused||S.bonus)return;
  if(S.busy){S.queued={dir,t:performance.now()};return;} // buffered: runs if the board settles within 300ms
  const [dx,dy]=DIRS[dir];
  if(S.tut&&(S.tut.merge||S.tut.dir&&dir!==S.tut.dir)){const sh=S.sh;sh.shake=1;sh.shakeDir=[dx,dy];sfx("bonk");buzz(6);return;} // a taught move takes only its own swipe
  S.idle=0;S.hint=null;S.aim=null;
  const plan=planThrow(dx,dy);
  if(!plan.steps.length&&!plan.kick){const sh=S.sh,bx=sh.x+.5+dx*.5,by=sh.y+.5+dy*.5;sh.shake=1;sh.shakeDir=[dx,dy];S.block={x:bx,y:by,dx,dy,t:0};S.kick={dx:dx*.6,dy:dy*.6,t:0}; // blocked: the blade bumps the edge, a dull thud of grit
    for(let i=0;i<5;i++){const a=Math.atan2(-dy,-dx)+rnd(-1.2,1.2),v=rnd(1.5,3.5);addP({k:2,x:bx,y:by,vx:Math.cos(a)*v,vy:Math.sin(a)*v,r:rnd(.025,.04),c:i%2?"#c9d0de":"#8a93a8",g:12,life:rnd(.2,.32)});}
    puff(bx-dx*.1,by-dy*.1,.3,.6,.3,"#9ea4b4",-.2,.7);sfx("bonk");buzz(6);return;}
  S.goalsAtThrow=goalsTotal();S.prevSh=[S.sh.x,S.sh.y];
  S.moves--;S.busy=true;S.thrown=true;S.pitch=0;S.chain=0;S.clearSum=0;S.clearN=0;$("hint").hidden=true;
  S.sh.charging=false;

// src: "sh" shuriken, "clone" (a clone blade), "arrow", "rocket" (rocket booster and diagonal-bomb rockets), "hammer", "barrel",
// "blast" (any explosion), "keg" (rolling powder keg), "bonus" (end-of-level shots)
// the rock rule: blades cut, explosions crush. The shuriken and its clones never break a rock; blasts, rockets and every shop booster do
const CRUSH={blast:1,barrel:1,arrow:1,rocket:1,hammer:1,bonus:1};
function hit(x,y,dx,dy,src,run,quiet){
  const st=S.stat[y][x];
  if(st==="mag")return; // magnets are bolted down: blades, blasts and boosters pass over them
  if(st==="rock"&&!CRUSH[src]){if(run)endRun(run);return;}
  if(st){breakStat(st,x,y,quiet);if(run)endRun(run);return;}
  const id=S.occ[y][x];if(id==null)return;
  const p=S.pieces.get(id);if(!p){S.occ[y][x]=null;return;}
  removePiece(p);S.clearSum+=p.x+(p.w-1)/2;S.clearN++;
  if(isPower(p.type)){ // a blade sends it along its own line; anything else fires it all ways
    firePower(p.type,p.x,p.y,src==="sh"||src==="clone"?[dx,dy]:null,src);
    if(src==="sh"){S.hitstop=Math.max(S.hitstop,.08);buzz(14);}
    if(run)endRun(run);return;}
  if(isExplosive(p.type)){const wind=p.type==="tnt"?.12:.09;const w=src==="blast"?Math.max(wind,rnd(.1,.13)):wind;
    S.booms.push({x:p.x,y:p.y,r:BLAST[p.type],type:p.type,t:-w,w0:w});
    if(src==="sh")S.hitstop=Math.max(S.hitstop,.07);
    if(run)endRun(run);return;}
  const same=!!run&&run.type===p.type;
  sliceFx(p,dx,dy,src);
  if(src==="sh"&&S.anim&&S.anim.kind==="sh"){const A=S.anim;A.kills=(A.kills||0)+1;(A.cuts||(A.cuts=[])).push(...cells(p));A.cutAt=[p.x+p.w/2,p.y+p.h/2];A.cutType=p.type;}
  if(src==="sh"){S.pitch++;const big=same&&run.n>=2;S.hitstop=Math.max(S.hitstop,big?.045:.022);if(big)S.slowT=.07;buzz(8);}
  if(!quiet)sfx("slice",{pitch:Math.max(0,S.pitch-1),type:p.type});
  // crates beside a sliced fruit crack too
  for(const [cx,cy] of cells(p))for(const [ax,ay] of N4){const nx=cx+ax,ny=cy+ay;if(playable(nx,ny)&&S.stat[ny][nx]==="crate")breakStat("crate",nx,ny,quiet);}
  if(run){if(!same)endRun(run);run.type=p.type;run.n++;run.cells.push(...cells(p));run.centers.push([p.x+p.w/2,p.y+p.h/2]);
    // the run coin sits beside the throw line (never on the blade's next cell or where the bomb is born): right/left of a vertical throw, above a horizontal one
    if(run.n>=2){let bx=p.x+p.w/2,by=p.y+p.h/2;if(dy)bx+=(bx<COLS/2?1:-1)*(p.w/2+.12);else by+=(p.y>0?-1:1)*(p.h/2+.12);S.bubbles.push({n:run.n,x:bx,y:by,t:0});}}
  hud();
}
// a run of 3+ of the same fruit in one throw is a combo; it leaves a bomb (3) or TNT (4+) behind
function endRun(run){if(run.n>=3&&S.anim&&S.anim.runs)S.anim.runs.push({n:run.n,type:run.type,cells:run.cells.slice(),centers:run.centers.slice()});run.type=null;run.n=0;run.cells=[];run.centers=[];}
function breakStat(st,x,y,quiet){
  S.stat[y][x]=null;S.statDirty=true;S.clearSum+=x;S.clearN++;
  if(st==="rock")S.rocks--;else S.crates--;

function explode(b){
  const big=b.r>1,cx=b.x+.5,cy=b.y+.5;

  S.bflash={a:reduced?.1:(big?.55:.35)*(recent?.35:1),t:0};
  S.fire.push({x:cx,y:cy,size:big?4.4:3,t:0,rot:rnd(0,6.28)});
  S.shock.push({x:cx,y:cy,r:b.r,t:0,a:1},{x:cx,y:cy,r:b.r,t:-.06,a:.45});
  glow(cx,cy,big?2.6:1.8,.25,.9);
  for(let i=0;i<(big?12:6);i++){const a=rnd(0,6.28),d=Math.random()*(b.r+.3);puff(cx+Math.cos(a)*d,cy+Math.sin(a)*d,.5,1.2,rnd(.45,.6),null,-.3,.95);}
  for(let i=0;i<(big?20:10);i++){const a=rnd(0,6.28),v=rnd(3,8)*(big?1.2:1);addP({k:0,x:cx,y:cy,vx:Math.cos(a)*v,vy:Math.sin(a)*v-2,r:rnd(.03,.07),c:["#2a2622","#4a4038","#16120f"][i%3],g:18,life:rnd(.5,.9)});}
  for(let i=0;i<(big?14:8);i++){const a=rnd(0,6.28),v=rnd(2,6);addP({k:4,x:cx,y:cy,vx:Math.cos(a)*v,vy:Math.sin(a)*v-1,s:rnd(.25,.45),rot:0,vr:rnd(-4,4),g:6,life:rnd(.3,.5),max:.5});}
  if(b.type==="keg"){S.hitstop=Math.max(S.hitstop,.06);if(!S.bonus)S.trauma=Math.min(1,S.trauma+.15); // red staves and steel hoops fly
    for(let i=0;i<8;i++){const a=rnd(-2.9,-.25),v=rnd(4,7.5);addP({k:3,img:"fx_debris_keg",x:cx+rnd(-.2,.2),y:cy+rnd(-.2,.2),vx:Math.cos(a)*v,vy:Math.sin(a)*v,s:rnd(.3,.45),rot:rnd(0,6.28),vr:rnd(-8,8),g:30,life:.7});}}
  // the end-of-level bonus chain celebrates: a light thump per blast, capped, never a pinned shake
  if(S.bonus)S.trauma=Math.min(.45,S.trauma+(big?.25:.16));else S.trauma=Math.min(1,S.trauma+(big?.7:.45)+Math.min(S.chain,3)*.15);
  sfx("boom",{pitch:S.chain*2,gain:big?1:.85});S.chain++;buzz(big?35:20);
  let n=0;
  for(let j=-b.r;j<=b.r;j++)for(let i=-b.r;i<=b.r;i++){const x=b.x+i,y=b.y+j;if(!playable(x,y)||isSh(x,y))continue;
    if(S.stat[y][x]==="rock"||S.stat[y][x]==="crate")n++;S.pending.push({x,y,dx:Math.sign(i)||1,dy:Math.sign(j),t:-Math.max(Math.abs(i),Math.abs(j))*.03});}
  if(n)sfx("blast",{gain:.25*Math.log2(n+1)});
  // neighbours just outside the blast get shoved outward and spring back
  for(const p of S.pieces.values()){const qx=p.x+(p.w-1)/2,qy=p.y+(p.h-1)/2;
    const d=Math.max(Math.max(0,Math.abs(qx-b.x)-(p.w-1)/2),Math.max(0,Math.abs(qy-b.y)-(p.h-1)/2));
    if(d>b.r&&d<=b.r+2){const vx=qx-b.x,vy=qy-b.y,l=Math.hypot(vx,vy)||1;p.shove={dx:vx/l,dy:vy/l,t:0};}}
}

// ---------- gravity & refill ----------
// one logical pass settles the whole board; each piece then animates along its recorded waypoints
function gravityStep(){
  let moved=false;
  const list=[...S.pieces.values()].sort((a,b)=>(b.y+b.h)-(a.y+a.h));
  for(const p of list)if(canMove(p,0,1)){movePiece(p,0,1);moved=true;}
  if(!moved||DIAG_FILL){
    for(const p of list){if(p.w!==1||p.h!==1)continue;if(DIAG_FILL&&canMove(p,0,1))continue;
      for(const dx of Math.random()<.5?[-1,1]:[1,-1]){const tx=p.x+dx,ty=p.y+1;
        if(isFree(tx,ty)&&!hasSource(tx,ty)){movePiece(p,dx,1);moved=true;break;}}}
  }
  for(let x=0;x<COLS;x++){const y=topRow[x];if(isFree(x,y)){spawn(x,y);moved=true;}}
  return moved;
}
function hasSource(x,y){let yy=y;while(true){if(yy===topRow[x])return true;yy--;if(!playable(x,yy)||S.stat[yy][x]||isSh(x,yy))return false;if(S.occ[yy][x]!=null)return canMove(S.pieces.get(S.occ[yy][x]),0,1);}}
function spawn(x,y){
  const r=Math.random();let t;
  if(r<.12&&cornSafe[x]&&isFree(x+1,y)&&topRow[x+1]===y)t="corn"; // never park a corn over a wall slit it can't fall past
  else if(r<.24&&isFree(x,y+1))t="daikon"; // as before: a corn roll that can't be placed becomes a daikon
  else t=["pepper","pepper","orange","dragon"][Math.random()*4|0];
  // new pieces enter from above the board edge, already stacked one cell apart
  const st=S.spawnStack||(S.spawnStack=Array(COLS).fill(0));let k;
  if(t==="corn"){k=Math.max(st[x],st[x+1])+1;st[x]=st[x+1]=k;}else{k=st[x]+SIZE[t][1];st[x]=k;}
  const p=addPiece(t,x,y,y-k);p.fresh=true;
}
function resolveGravity(){
  S.spawnStack=Array(COLS).fill(0);let any=false,g=0;
  while(g++<400&&gravityStep())any=true;
  S.spawnStack=null;
  if(any){const cx=S.clearN?S.clearSum/S.clearN:(COLS-1)/2;const fresh=[];for(const p of S.pieces.values())if(p.fresh)fresh.push(p);
    fresh.sort((a,b)=>(b.y+b.h)-(a.y+a.h));const cnt=Array(COLS).fill(0);
    // the stack unzips bottom-up; columns start outward from the cleared area
    for(const p of fresh){let r=0;for(let i=0;i<p.w;i++)r=Math.max(r,cnt[p.x+i]);for(let i=0;i<p.w;i++)cnt[p.x+i]=r+1;
      p.delay=r*.015+Math.abs(p.x+(p.w-1)/2-cx)*.02;p.fresh=false;p.vel=0;}}
  return any;
}
function settled(){for(const p of S.pieces.values())if(p.path||p.vy!==p.y||p.vx!==p.x)return false;return true;}
function finishTurn(){
  if(S.bonus){S.bonus.calm=true;return;}
  S.busy=false;S.pitch=0;S.chain=0;
  if(S.goalsAtThrow!=null){S.dry=goalsTotal()<S.goalsAtThrow?0:(S.dry||0)+1;S.goalsAtThrow=null;} // throws in a row that gained no goal
  if(S.moves===5&&!S.warned5&&(S.crates>0||S.rocks>0)){S.warned5=true;showRibbon("5 Moves Left!","slide");sfx("warn");}
  check();
  if(S.tutNext&&!S.over){const n=S.tutNext;S.tutNext=null;startTut(n.kind,n.step);}
  else if(S.tipNext&&!S.over){const k=S.tipNext;S.tipNext=null;toast(TIP2[k],4200);}
  const q=S.queued;S.queued=null;
  if(q&&!S.over&&performance.now()-q.t<300)throwSh(q.dir);
}
function check(){
  if(!S||S.ending)return;
  const won=S.crates<=0&&S.rocks<=0;
  if(!won&&S.moves>0)return;
  S.over=true;$("hint").hidden=true;if(S.mode)setMode(null);
  if(S.flyers>0){S.awaitFly=true;return;} // wait for the last goal to land in the HUD
  S.ending=true;hud();
  if(won)startBonus();
  else{const g=S.gid;setTimeout(()=>{if(S.gid===g)lose();},450);}
}

// ---------- boosters ----------
const BOOST={hammer:["Hammer","Hammer!","Tap any tile to smash it!"],arrow:["Arrow","Arrow!","Tap to clear a whole row!"],rocket:["Rocket","Rocket!","Tap to blast a whole column!"]};
const TRAY=[["bHammer","hammer"],["bArrow","arrow"],["bRocket","rocket"]];
function boostUI(kind){
  const on=!!kind;document.body.classList.toggle("arming",on);
  for(const [id,k] of TRAY){const b=$(id);b.classList.toggle("armed",on&&k===kind);b.classList.toggle("off",on&&k!==kind);}
  const bb=$("bbanner");
  if(on){$("bbArt").src=`assets/${kind}.webp`;$("bbTitle").textContent=BOOST[kind][1];$("bbText").textContent=BOOST[kind][2];bb.classList.add("show");}
  else bb.classList.remove("show");

function setMode(m){if(!S)return;S.mode=m;hover=null;if(!S.anim||S.anim.kind==="sh")boostUI(m);if(m){sfx("arm");S.idle=0;S.hint=null;}}
const aimOk=c=>S.mode==="hammer"?playable(c.x,c.y):c.x>=0&&c.y>=0&&c.x<COLS&&c.y<ROWS;
function useBoost(kind,x,y){
  if(!S)return;if(S.intro)skipIntro();
  if(S.anim||S.bonus||!(S.boosts[kind]>0))return;
  if(kind==="hammer"&&(!playable(x,y)||isSh(x,y)||(!S.stat[y][x]&&S.occ[y][x]==null)))return; // nothing there to smash
  S.boosts[kind]--;S.mode=null;hover=null;S.busy=true;S.idle=0;S.hint=null;S.dry=0;S.clearSum=0;S.clearN=0;S.pitch=0;S.chain=0;

    S.anim={kind:"rocket",line:x,top,bot,phase:"hl",pt:0,pos:bot+1.05,idx:bot,v:0,em:0};}
  else if(kind==="arrow"){const fromLeft=x>=COLS/2,dir=fromLeft?1:-1;const order=[...Array(COLS).keys()];if(!fromLeft)order.reverse();
    let lo=COLS,hi=-1;for(let i=0;i<COLS;i++)if(playable(i,y)){lo=Math.min(lo,i);hi=Math.max(hi,i);}
    const d0=dir>0?lo:COLS-1-hi,d1=dir>0?hi+1:COLS-lo; // the row's entry and exit rim, as distances from the entry side
    // the wind-up happens inside the board (tail just clear of the canvas edge); the arrow then flies until its tip sticks in the far rim
    S.anim={kind:"arrow",line:y,order,t:0,idx:0,dir,phase:"hl",pt:0,em:0,p0:d0+.75,pEnd:Math.max(d0+.75,d1+.03-ARW)};}

    let ty=Math.max(Math.min(top+1,bot),Math.min(Math.max(bot-1,top),y==null?top:y)); // at least one cell in from either rim, so its fireball stays inside the board
    for(let k=1;!playable(x,ty)&&k<ROWS;k++){if(playable(x,ty+k)&&ty+k<bot){ty+=k;break;}if(playable(x,ty-k)&&ty-k>top){ty-=k;break;}}
    // the barrel drops onto the tapped cell, then a flame column races up and down from it
    S.anim={kind:"barrel",line:x,ty,top,bot,maxD:Math.max(ty-top,bot-ty),d:0,t:0,dir:1,phase:"hl",pt:0,em:0};}
  hud();

function makePowerUp(r,type,big){
  const free=[...r.cells].reverse().filter(([cx,cy])=>isFree(cx,cy)),nextTo=([cx,cy])=>N4.some(([ax,ay])=>{const q=pieceAt(cx+ax,cy+ay);return q&&isPower(q.type)&&!q.path;});
