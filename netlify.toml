# zamilur.com is a static site with no build step: Netlify publishes the site/ folder as it is.
# These settings take priority over the ones in the Netlify dashboard.
[build]
  publish = "site"
  command = ""
  # prototypes-gate.js here puts the Prototypes page and play/* behind a code (see that file to change it)
  edge_functions = "netlify/edge-functions"
